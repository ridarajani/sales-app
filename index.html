<style>
/* Layout: operations console. Sticky left rail of modules, top bar with company + "acting as" role, content as stacked panels. Rail becomes a scrolling strip on phones. */
:root{
  --bg:#FBF7F2; --surface:#FFFFFF; --surface-2:#F4ECE4; --line:#E6D8CC; --ink:#2B1419; --muted:#6F5A5E;
  --accent:#7A1F35; --accent-ink:#FFFFFF; --accent-soft:#F6E3E8; --gold:#B8892B; --gold-ink:#2B1419; --gold-soft:#F7EDD5;
  --warn:#9A5F00; --warn-soft:#FBEED3; --bad:#B3261E; --bad-soft:#FBE2DF; --good:#1D7536; --good-soft:#DCF1E1; --info:#2B5797; --info-soft:#E0E9F7;
  --c-LV:#B8892B; --c-ZT:#8A4FA3; --c-ZF:#2F62A8; --c-GL:#C25A2E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170D10; --surface:#22151A; --surface-2:#2D1C22; --line:#462C34; --ink:#F4E9EC; --muted:#B9A2A8;
  --accent:#E58FA3; --accent-ink:#2A0A12; --accent-soft:#3F1C26; --gold:#E2BC5C; --gold-ink:#2A1A04; --gold-soft:#3A2D12;
  --warn:#E5A83C; --warn-soft:#3A2B0F; --bad:#F27B71; --bad-soft:#3E1A17; --good:#62C67F; --good-soft:#15301F; --info:#86ABE9; --info-soft:#17263C;
  --c-LV:#E2BC5C; --c-ZT:#C391D8; --c-ZF:#74A0E4; --c-GL:#E39070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170D10; --surface:#22151A; --surface-2:#2D1C22; --line:#462C34; --ink:#F4E9EC; --muted:#B9A2A8;
  --accent:#E58FA3; --accent-ink:#2A0A12; --accent-soft:#3F1C26; --gold:#E2BC5C; --gold-ink:#2A1A04; --gold-soft:#3A2D12;
  --warn:#E5A83C; --warn-soft:#3A2B0F; --bad:#F27B71; --bad-soft:#3E1A17; --good:#62C67F; --good-soft:#15301F; --info:#86ABE9; --info-soft:#17263C;
  --c-LV:#E2BC5C; --c-ZT:#C391D8; --c-ZF:#74A0E4; --c-GL:#E39070; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.1rem} h3{font-size:.98rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding-block:16px}

.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}

.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.nav button:hover{background:var(--surface-2)}

.main{min-width:0;display:flex;flex-direction:column}

.top .ctl{display:flex;align-items:center;gap:8px}
.top label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.who{margin-left:auto;font-size:.82rem;color:var(--muted)}
.content{padding:22px 24px 60px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}

.grid{display:grid;gap:14px}

.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}

tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.co{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.co i{width:9px;height:9px;border-radius:2px;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.75rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:.82rem}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kv dd.txt{font-family:var(--f-body)}
.credit{border-radius:var(--r);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.flag b{font-weight:700}
.skulist{display:flex;flex-direction:column}

.sku .meta{font-size:.8rem;color:var(--muted)}

.step input{width:56px;border:0;text-align:center;height:34px;font-family:var(--f-mono);background:var(--surface)}
.journey{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.journey div{font-size:.72rem;padding:8px 6px 6px;border-top:4px solid var(--surface-2);color:var(--muted);line-height:1.25}
.journey div.done{border-color:var(--accent);color:var(--ink)}
.journey div.cur{border-color:var(--warn);color:var(--ink);font-weight:700}
.journey div.stop{border-color:var(--bad);color:var(--bad);font-weight:700}
.journey small{display:block;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-weight:400;margin-top:2px}
.actionbox{border:2px solid var(--accent);border-radius:var(--r);padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.actionbox .eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.gate{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:.88rem}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:.86rem}
.bar .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden;position:relative}
.bar .t i{display:block;height:100%;border-radius:3px}
.bar .t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 0;overflow:hidden}
.alert>i{align-self:stretch;margin:-10px 0}
.walk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.walk .panel{display:flex;flex-direction:column;gap:8px}

.hero h1{font-size:1.9rem}
.hero p{margin:8px 0 0;opacity:.85;max-width:62ch}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.flow span{font-size:.78rem;border:1px solid color-mix(in srgb,var(--surface) 35%,transparent);border-radius:4px;padding:4px 8px}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.modal-bg{position:fixed;inset:0;background:rgba(5,12,10,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:var(--r);max-width:760px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.doc{background:#FFFFFF;color:#1A1A1A;border:1px solid #D0D0D0;padding:26px 28px;font-size:.86rem;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}

.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #1A1A1A;padding-bottom:10px}
.doc .dh b{font-family:var(--f-display);font-size:1.2rem}
.doc .dt{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;text-align:right}
.doc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px;font-size:.78rem;color:#555}
.doc .sig div{border-top:1px solid #888;padding-top:4px}
.doc .wm{position:absolute;right:-40px;top:30px;transform:rotate(30deg);background:#F6D99B;color:#6B4A00;font-weight:700;font-size:.7rem;letter-spacing:.15em;padding:4px 50px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{padding:24px;text-align:center;color:var(--muted)}
details>summary{cursor:pointer}
.zoho-mark{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;color:var(--good)}
.zoho-mark::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.assume{border-left:3px solid var(--warn);padding:2px 0 2px 12px;font-size:.86rem}
@media (max-width:980px){.split,.hero{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.journey{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){

  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:10px 0}
  .brand{padding:0 16px 8px;margin:0;border:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

  .g2,.g3{grid-template-columns:1fr}
  .bar{grid-template-columns:90px minmax(0,1fr) 92px}

  .doc .sig{grid-template-columns:1fr}
}

@media (max-width:760px){.stick{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

      const take=Math.min(need,b.qty-b.res-(b.tr||0));if(take>0){b.res+=take;need-=take;l.alloc.push({b:b.no,q:take})}});
    l.shortStock=need>0?need:0;
  });
}
function release(o){o.lines.forEach(l=>(l.alloc||[]).forEach(a=>{const b=S.batches.find(x=>x.no===a.b);if(b)b.res=Math.max(0,b.res-a.q)}));}
function consume(sku,qty,co){const used=[];let need=qty;batchesFor(sku).filter(sellable).sort((a,b)=>a.exp-b.exp).forEach(b=>{if(need<=0)return;const t=Math.min(need,b.qty-b.res);if(t>0){b.qty-=t;need-=t;used.push({b:b.no,q:t})}});return used}
function putBack(sku,qty,batchNo){let b=batchNo&&S.batches.find(x=>x.no===batchNo&&x.status==='Available');if(!b)b=batchesFor(sku).filter(sellable).sort((a,c)=>c.exp-a.exp)[0];if(b)b.qty+=qty}

/* ================= credit ================= */
function tempLimit(cust,co){return sum(S.temp.filter(t=>t.cust===cust&&t.co===co&&t.status==='approved'&&t.until>=T0).map(t=>t.amount))}
function credit(cust,co,extra=0,excludeNo=null){
  const c=CUST[cust];const [base,terms]=(c.cr[co]||[0,0]);const temp=tempLimit(cust,co);const limit=base+temp;
  const inv=S.invoices.filter(i=>i.cust===cust&&i.co===co&&bal(i)>0);
  const outstanding=sum(inv.map(bal));
  const overdue=sum(inv.filter(i=>i.due<T0).map(bal));
  const overdueHold=sum(inv.filter(i=>i.due<T0-S.settings.tol*DAY).map(bal));
  const oldest=inv.filter(i=>i.due<T0).reduce((m,i)=>Math.max(m,Math.floor((T0-i.due)/DAY)),0);
  const pipeline=sum(S.orders.filter(o=>o.cust===cust&&o.co===co&&o.pay==='credit'&&o.no!==excludeNo&&['awaiting_wh','ready_to_load','loaded','dispatched'].includes(o.status)).map(orderTotal));
  const available=limit-outstanding-pipeline;
  return{base,temp,limit,terms,outstanding,overdue,overdueHold,oldest,pipeline,available,after:available-extra,extra,cashOnly:!!c.cashOnly};
}
function checks(o){
  const c=CUST[o.cust];const out=[];
  if(o.pay==='credit'&&c.cashOnly)out.push(['block','Cash-only customer','This customer pays cash only.']);
  const ds=[...new Set(o.lines.filter(l=>l.disc&&!l.free).map(l=>l.why))];ds.forEach(w=>out.push(['good','Discount',w]));
  return out;
}

/* ================= promotions ================= */
function activePromos(co,sku,ch){return [];return S.promos.filter(p=>p.active&&p.co===co&&(!p.sku||p.sku===sku)&&(!p.ch||p.ch===ch)&&p.to>=T0&&p.from<=T0+DAY)}
function buildLines(d,chOverride){
  const c=CUST[d.cust];const ch=chOverride||c.ch;const cash2=(d.cash2&&d.pay==='cash')?2:0;const man=Math.max(0,Math.min(50,+d.disc||0));const out=[];
  Object.entries(d.qty).filter(([,q])=>q>0).forEach(([sku,qty])=>{
    const pr=activePromos(d.co,sku,ch);const pct=Math.max(0,...pr.filter(p=>p.type==='pct').map(p=>p.pct));
    const disc=cash2+man;
    const why=[cash2?'2% full cash':'',man?`${man}% extra discount`:''].filter(Boolean).join(' + ');
    out.push({sku,qty,price:price(sku,ch,c.id),disc,why});
    pr.filter(p=>p.type==='free'&&qty>=p.buy).forEach(p=>out.push({sku,qty:Math.floor(qty/p.buy)*p.get,price:0,disc:0,free:true,why:p.name}));
  });return out;
}

function rejectOrder(o,note){o.status='rejected';o.hist.push({at:now(),by:me(),t:'Rejected',d:note||''});audit('Order rejected',o.no,note||'')}

function makeInvoice(co,cust,lines,pay,ref,collector){

function deliver(o,recv,pod,delivered){

    (l.alloc||[]).forEach(a=>{const b=S.batches.find(x=>x.no===a.b);if(!b||!a.used)return;b.tr=Math.max(0,(b.tr||0)-a.used);const t=Math.min(left,a.used);b.qty-=t;left-=t});
    refused+=l.loaded-l.deliv});

  audit('Return: '+step,r.no,x?String(x):'');
}

function tripClose(t,ret,counted){
  t.lines.forEach((l,i)=>{l.ret=ret[i];l.missing=Math.max(0,l.loaded-l.sold-l.ret);let lost=l.missing;
    (l.batches||[]).forEach(a=>{const b=S.batches.find(x=>x.no===a.b);if(!b)return;const open=a.q-a.sold;b.tr=Math.max(0,(b.tr||0)-open);const x=Math.min(lost,open);b.qty-=x;lost-=x})});
  t.expected=sum(t.sales.filter(s=>s.pay==='cash').map(s=>s.amount));t.counted=counted;t.diff=counted-t.expected;t.status='closed';t.closeAt=now();
  t.hist.push({at:now(),by:me(),t:'Trip closed',d:`Returned ${sum(ret)} ctn to stock. Cash expected ${money(t.expected)}, counted ${money(counted)}.`});

  Object.entries(od).forEach(([k,v])=>{const[c,co]=k.split('|');A.push({sev:'bad',t:`${CUST[c].name} owes ${money(v)} overdue`,d:`${CO[co].name} · follow up: ${USERS[CO[co].mgr].name} and finance`,go:['customer',c]})});

  vis.filter(o=>o.status==='awaiting_wh'&&o.at<T0).forEach(o=>A.push({sev:'warn',t:`${o.no} not picked since yesterday`,d:'Approved order waiting past the warehouse cutoff',go:['order',o.no]}));
  vis.filter(o=>o.lines.some(l=>l.picked!=null&&l.picked<l.qty)&&!['invoiced','cancelled'].includes(o.status)).forEach(o=>A.push({sev:'warn',t:`${o.no} short picked`,d:o.lines.filter(l=>l.picked<l.qty).map(l=>`${l.sku}: ${l.picked} of ${l.qty} (${l.var})`).join('; '),go:['order',o.no]}));
  vis.filter(o=>o.status==='dispatched'&&o.dispAt<T0).forEach(o=>A.push({sev:'warn',t:`${o.no} delivery not confirmed`,d:'Left the warehouse before today',go:['order',o.no]}));
  
  const cash={};S.receipts.filter(r=>inVis(r)&&r.custody==='with').forEach(r=>{const k=r.collector+'|'+r.co;cash[k]=(cash[k]||0)+r.amount});

  return A;
}

  const inv=S.invoices.filter(inVis);const ms=new Date(T0);ms.setDate(1);const MS=ms.getTime();const cos=visCos();
  const today=sum(inv.filter(i=>i.date>=T0).map(i=>i.total)),mtd=sum(inv.filter(i=>i.date>=MS).map(i=>i.total));
  const tgt=sum(cos.map(c=>sum(Object.values(S.tg[c]))));const rec=sum(inv.map(bal)),od=sum(inv.filter(i=>i.due<T0).map(bal));
  const cash=sum(S.receipts.filter(r=>inVis(r)&&(r.custody==='with'||r.custody==='submitted')).map(r=>r.amount));
  const N=(l,v,s,go,cls,p)=>`<button class="bignum ${cls||''}" data-go="${go}" ${p?`data-p="${p}"`:''}><span class="l">${l}</span><span class="v">${v}</span><span class="s">${s}</span></button>`;
  const byCo=cos.map(c=>({c,v:sum(inv.filter(i=>i.co===c&&i.date>=MS).map(i=>i.total)),t:sum(Object.values(S.tg[c]))}));const mx=Math.max(...byCo.map(x=>Math.max(x.v,x.t)),1);
  return `${head('dash','Today’s numbers','Tap a number to see what is behind it.')}

  <div class="card"><h2>This month by company</h2><p class="small muted" style="margin:-4px 0 12px">The black mark is the target.</p><div class="bars">${byCo.map(x=>`<div class="bar"><span>${coTag(x.c)}</span><span class="t"><i style="width:${x.v/mx*100}%;background:var(--c-${x.c})"></i><u style="left:${x.t/mx*100}%"></u></span><span class="num">${kmoney(x.v)}</span></div>`).join('')}</div></div>

};

   <div class="list">${o.lines.map(l=>`<div class="li"><span><b>${l.qty}</b> × ${esc(SKU[l.sku].brand)} ${esc(SKU[l.sku].pack)}${l.free?' <span class="pill good">free</span>':l.disc?` <span class="pill good">−${l.disc}%</span>`:''}</span><span class="num">${l.free?'free':money(lineNet(l))}</span></div>`).join('')}<div class="li"><b>Total</b><b class="num">${money(tot)}</b></div></div>

  if(o.status==='dispatched')return wrap('Hand over the goods',gate(['drv','mgmt'],o)||`<label class="field"><span>Name of the person who received the goods</span><input id="dl-recv" class="inp big" placeholder="e.g. Grace"></label><label class="row"><input type="checkbox" id="dl-pod" checked> They signed on the phone</label>

    <details><summary class="small">Customer did not take everything?</summary><div class="list" style="margin-top:8px">${o.lines.map((l,i)=>`<div class="li"><span>${esc(SKU[l.sku].brand)} ${esc(SKU[l.sku].pack)} (${l.loaded} loaded)</span><input type="number" id="dv-${i}" class="inp" value="${l.loaded}" style="width:80px"></div>`).join('')}</div><p class="small muted">Enter what they took. The rest goes back to the warehouse.</p></details>`);
  return '';
}
V.order=()=>{
  const o=order(S.ui.p);if(!o)return '<div class="empty">Order not found</div>';const c=CUST[o.cust];const inv=o.inv&&S.invoices.find(i=>i.no===o.inv);const[s,k]=SAY[o.status];
  const cancel=['pending_approval','awaiting_wh','ready_to_load'].includes(o.status)&&['mgmt','sales'].includes(U().role)&&U().cos.includes(o.co);
  return `<div class="head"><div><h1>${esc(c.name)}</h1><p>${coTag(o.co)} · order <span class="mono">${o.no}</span> · ${money(orderTotal(o))}</p></div></div>
  ${big(`<b>${s}</b>${o.status==='invoiced'&&inv?` · invoice ${inv.no} ${bal(inv)?`· ${money(bal(inv))} still to pay`:'· paid'}`:''}`,k)}
  ${dots(o)}
  ${actionFor(o)}
  <div class="card"><h2>Products</h2><div class="list">${o.lines.map(l=>`<div class="li"><span><b>${l.qty}</b> × ${esc(SKU[l.sku].brand)} ${esc(SKU[l.sku].prod)} ${esc(SKU[l.sku].pack)}${l.free?' '+pill('free','good'):''}${l.var?`<div class="small" style="color:var(--warn)">Only ${l.picked} picked: ${esc(l.var)}</div>`:''}${l.deliv!=null&&l.deliv<l.loaded?`<div class="small" style="color:var(--warn)">${l.deliv} delivered</div>`:''}</span><span class="num">${l.free?'free':money(lineNet(l))}</span></div>`).join('')}</div></div>
  <details class="card"><summary>More details (documents, history, credit)</summary><div class="grid" style="margin-top:12px">
   <div class="row">${['so','dn','gp','inv'].filter(t=>t==='so'||(t==='inv'?inv:o[t])).map(t=>`<button class="btn sm" data-act="doc" data-t="${t}" data-no="${o.no}">${{so:'Sales order',dn:'Delivery note',gp:'Gate pass',inv:'Invoice'}[t]}</button>`).join('')}</div>
   <dl class="kv"><dt>Salesman</dt><dd class="txt">${esc(USERS[o.salesman].name)}</dd><dt>Payment</dt><dd class="txt">${PAY[o.pay]}</dd><dt>Deliver to</dt><dd class="txt">${esc(o.loc)}</dd><dt>Deliver on</dt><dd class="txt">${fdate(o.req)}</dd><dt>Came by</dt><dd class="txt">${esc(o.src||'')}</dd>${o.vehicle?`<dt>Vehicle</dt><dd class="txt">${esc(o.vehicle)} · ${esc(o.driver)}</dd>`:''}${o.notes?`<dt>Note</dt><dd class="txt">${esc(o.notes)}</dd>`:''}</dl>
   <div class="list">${o.hist.slice().reverse().map(h=>`<div class="li" style="align-items:flex-start"><div><b>${esc(h.t)}</b><div class="small muted">${esc(h.d)}</div></div><div class="small muted" style="text-align:right;white-space:nowrap">${fdt(h.at)}<div>${esc(h.by)}</div></div></div>`).join('')}</div>
   
   ${cancel?`<button class="btn danger sm" data-act="cancel" data-no="${o.no}" style="justify-self:start">Cancel this order</button>`:''}</div></details>`;
};

/* ---- warehouse ---- */
V.warehouse=()=>{
  const vis=S.orders.filter(inVis);
  const sec=(st,t,btn)=>{const l=vis.filter(o=>o.status===st);return l.length?`<h2>${t} <span class="mono muted">${l.length}</span></h2><div class="grid">${l.map(o=>`<div class="card row" style="justify-content:space-between"><div><b class="lg">${esc(CUST[o.cust].name)}</b><div class="small muted">${coTag(o.co)} · ${sum(o.lines.map(l=>l.qty))} cartons · deliver ${fday(o.req)}</div>${o.notes?`<div class="small">“${esc(o.notes)}”</div>`:''}</div><button class="btn pri big" data-go="order" data-p="${o.no}">${btn}</button></div>`).join('')}</div>`:''};
  const tl=S.trips.filter(t=>inVis(t)&&t.status==='planned');
  const body=sec('awaiting_wh','To pick','Pick')+sec('ready_to_load','To load','Load')+sec('loaded','At the gate','Let out')+(tl.length?`<h2>Trip vans to load</h2><div class="grid">${tl.map(t=>`<div class="card row" style="justify-content:space-between"><div><b class="lg">${t.type==='minibus'?'Minibus':'Upcountry'}: ${esc(t.route)}</b><div class="small muted">${coTag(t.co)} · ${fday(t.date)} · ${sum(t.lines.map(l=>l.plan))} cartons</div></div><button class="btn pri big" data-go="trip" data-p="${t.no}">Load</button></div>`).join('')}</div>`:'');
  return `${head('warehouse','Jobs to do','Approved orders appear here by themselves. Do them from top to bottom.')}${body||'<div class="card empty">No jobs right now.</div>'}`;
};
V.deliveries=()=>{
  const l=S.orders.filter(o=>inVis(o)&&o.status==='dispatched');
  return `${head('deliveries','Deliveries','Orders on the road. The driver confirms when the goods are handed over.')}<div class="grid">${l.map(o=>`<div class="card row" style="justify-content:space-between"><div><b class="lg">${esc(CUST[o.cust].name)}</b><div class="small muted">${esc(o.loc)} · ${esc(o.vehicle)} · ${esc(o.driver)}</div></div><button class="btn pri big" data-go="order" data-p="${o.no}">Open</button></div>`).join('')||'<div class="card empty">Nothing on the road</div>'}</div>`;
};

/* ---- stock ---- */
V.stock=()=>{
  const f=S.ui.p||'list';const isWh=['wh','mgmt'].includes(U().role);
  if(f==='receive')return `${head('stock','Receive stock','New cartons arrived. Copy the batch number and expiry date from the carton.')}${isWh?`<div class="card grid"><div class="fields" style="grid-template-columns:1fr">
    <label class="field"><span>Which product?</span>${sel('gr-sku',SKUS.filter(inVis).map(s=>[s.id,`${s.brand} ${s.prod} ${s.pack}`]),'')}</label>
    <label class="field"><span>How many cartons?</span><input id="gr-qty" type="number" class="inp big" value="100"></label>
    <label class="field"><span>Batch number on the carton</span><input id="gr-batch" class="inp big" placeholder="e.g. KG025-2610A"></label>
    <label class="field"><span>Expiry date on the carton</span><input id="gr-exp" type="date" class="inp big" value="${new Date(dOff(360)+12*36e5).toISOString().slice(0,10)}"></label></div>
    <button class="btn pri huge" data-act="grn">Add to stock</button></div>`:gate(['wh'],{co:visCos()[0]})}`;
  if(f==='adjust')return `${head('stock','Report damage or a count difference','Management must say yes before the stock changes.')}${isWh?`<div class="card grid"><div class="fields" style="grid-template-columns:1fr">
    <label class="field"><span>Which batch?</span>${sel('aj-batch',S.batches.filter(b=>inVis(b)&&b.qty>0).map(b=>[b.no,`${SKU[b.sku].brand} ${SKU[b.sku].pack} · batch ${b.no} · ${b.qty} cartons`]),'')}</label>
    <label class="field"><span>Cartons to remove (or add, for a count difference)</span>${sel('aj-dir',[['-','Remove'],['+','Add']],'-')}<input id="aj-qty" type="number" class="inp big" value="1"></label>
    <label class="field"><span>Why?</span>${sel('aj-reason',ADJ_REASONS,ADJ_REASONS[0])}</label></div>
    <button class="btn pri huge" data-act="adj">Send to Management</button></div>`:gate(['wh'],{co:visCos()[0]})}`;
  const rows=SKUS.filter(inVis).map(s=>({s,st:skuStock(s.id),bs:batchesFor(s.id).filter(b=>b.qty>0)}));
  return `${head('stock','Stock','Cartons free to sell, per product.')}
  ${isWh?`<div class="row"><button class="btn pri big" data-go="stock" data-p="receive">Receive stock</button><button class="btn big" data-go="stock" data-p="adjust">Report damage</button></div>`:''}
  <div class="grid">${rows.map(({s,st,bs})=>{const soon=bs.some(b=>b.exp<dOff(90));const exp=bs.some(b=>b.exp<T0);const low=st.avail<s.min;return `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(s.brand)} ${esc(s.prod)} ${esc(s.pack)}</b><div class="small muted">${esc(CO[s.co].name)} · ${FAC[CO[s.co].fac]}</div></div><div style="text-align:right"><b class="lg mono">${st.avail}</b> <span class="small muted">cartons</span><div>${exp?pill('Has expired stock','bad'):low?pill('Running low','warn'):soon?pill('Some expiring soon','warn'):pill('OK','good')}</div></div></div>
   <details><summary class="small">Batches and expiry</summary><div class="list" style="margin-top:6px">${bs.sort((a,b)=>a.exp-b.exp).map(b=>{const[t,k]=batchState(b);return `<div class="li"><span class="small"><a href="#" data-act="trace" data-b="${b.no}" class="mono">${b.no}</a> · expires ${fdate(b.exp)}</span><span class="small">${b.qty} ctn ${pill(t,k)}</span></div>`}).join('')}</div>
   <p class="small muted">${st.reserved} held for orders · ${st.transit} on vans · minimum ${s.min}</p></details></div>`}).join('')}</div>`;
};

/* ---- customers ---- */
V.customers=()=>{
  const q=(S.ui.q||'').toLowerCase();const cos=visCos();
  const rows=CUSTS.filter(c=>!c.walkin&&cos.some(x=>c.cr[x])&&(!q||c.name.toLowerCase().includes(q))).map(c=>{const cr=cos.filter(x=>c.cr[x]).map(x=>credit(c.id,x));return{c,out:sum(cr.map(x=>x.outstanding)),od:sum(cr.map(x=>x.overdue))}}).sort((a,b)=>b.od-a.od);
  return `${head('customers','Customers','Late payers are at the top.',['mgmt','sales'].includes(U().role)?'<button class="btn" data-act="newcust-form">Add a new shop</button>':'')}
  <input id="c-search" class="inp big" placeholder="Type a shop name" value="${esc(S.ui.q||'')}">
  <div class="picklist">${rows.map(r=>`<button class="pick" data-go="customer" data-p="${r.c.id}"><b>${esc(r.c.name)}</b><span class="small muted">${esc(r.c.loc)}</span><span class="small">${r.c.cashOnly?'Cash only':`Owes ${money(r.out)}`}${r.od?` · <b style="color:var(--bad)">${money(r.od)} late</b>`:''}</span></button>`).join('')}</div>`;
};
function newCustForm(){const cos=U().cos;return `<h2>Add a new shop</h2><p class="muted" style="margin:0">Management will check it before the shop can buy on credit.</p><div class="fields" style="grid-template-columns:1fr">
 <label class="field"><span>Shop name</span><input id="nc-name" class="inp big"></label><label class="field"><span>Where is it?</span><input id="nc-loc" class="inp"></label><label class="field"><span>Phone</span><input id="nc-phone" class="inp" inputmode="tel"></label>
 <label class="field"><span>Type of shop</span>${sel('nc-ch',Object.entries(CH).map(([k,v])=>[k,v.label]),'wholesaler')}</label><label class="field"><span>Buys from</span>${sel('nc-co',cos.map(c=>[c,CO[c].name]),cos[0])}</label>
 <label class="field"><span>Credit wanted (MWK). Leave 0 for cash only</span><input id="nc-limit" class="inp" inputmode="numeric" value="0"></label></div>
 <div class="row"><button class="btn pri big" data-act="new-cust">Send to Management</button></div>`}
V.customer=()=>{
  const c=CUST[S.ui.p];if(!c)return'';const cos=visCos().filter(x=>c.cr[x]);const canSell=['mgmt','sales'].includes(U().role);
  const stmt=co=>{const ev=[...S.invoices.filter(i=>i.cust===c.id&&i.co===co).map(i=>({at:i.date,doc:i.no,t:'Invoice',dr:i.total,cr:0,due:i.due})),...S.receipts.filter(r=>r.cust===c.id&&r.co===co).map(r=>({at:r.at,doc:r.no,t:'Paid · '+PAY[r.mode],dr:0,cr:r.amount})),...S.returns.filter(r=>r.cust===c.id&&r.co===co&&r.cn).map(r=>({at:r.hist[r.hist.length-1].at,doc:r.cn,t:'Credit note',dr:0,cr:r.amount}))].sort((a,b)=>a.at-b.at);let run=0;ev.forEach(e=>{run+=e.dr-e.cr;e.bal=run});return ev.slice(-10)};
  return `<div class="head"><div><h1>${esc(c.name)}</h1><p>${esc(c.loc)}${c.phone?' · '+esc(c.phone):''}</p></div></div>
  ${canSell?`<div class="tiles small3"><button class="tile primary" data-act="order-for" data-cust="${c.id}"><span class="ic">${icon('order')}</span><span class="tl">New order</span></button><button class="tile" data-act="pay-for" data-cust="${c.id}"><span class="ic">${icon('money')}</span><span class="tl">Collect money</span></button><button class="tile" data-act="ret-for" data-cust="${c.id}"><span class="ic">${icon('return')}</span><span class="tl">Return goods</span></button></div>`:''}
  ${cos.map(co=>{const cr=credit(c.id,co);return `<div class="card grid"><h2>${coTag(co)}</h2>
   ${c.cashOnly?big('Pays cash only.','info'):big(`Owes <b>${money(cr.outstanding)}</b>${cr.overdue?` · <b>${money(cr.overdue)} is late</b>`:' · nothing late'} · can still buy <b>${money(Math.max(0,cr.available))}</b>`,cr.overdue?'bad':'good')}
   <details><summary class="small">Statement and credit details</summary><div class="grid" style="margin-top:8px"><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>What</th><th class="num">Charged</th><th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>${stmt(co).map(e=>`<tr><td>${fdate(e.at)}</td><td>${e.t} <span class="mono small muted">${e.doc}</span>${e.due&&e.dr?`<div class="small muted">due ${fdate(e.due)}</div>`:''}</td><td class="num">${e.dr?money(e.dr):''}</td><td class="num">${e.cr?money(e.cr):''}</td><td class="num">${money(e.bal)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nothing yet</td></tr>'}</tbody></table></div>
   ${creditPanel({...cr,extra:0,after:cr.available},c.id)}
   ${!c.cashOnly&&canSell?`<div class="grid"><b>Ask for more credit for a short time</b><div class="fields"><label class="field"><span>Extra credit (MWK)</span><input id="tl-amt-${co}" class="inp" inputmode="numeric" value="500000"></label><label class="field"><span>For how long</span>${sel('tl-days-'+co,[[7,'1 week'],[14,'2 weeks'],[30,'1 month']],14)}</label><label class="field"><span>Why</span><input id="tl-why-${co}" class="inp"></label></div><button class="btn" data-act="temp" data-cust="${c.id}" data-co="${co}" style="justify-self:start">Send to Management</button></div>`:''}
   ${S.temp.filter(t=>t.cust===c.id&&t.co===co).map(t=>`<div class="small">Extra credit ${money(t.amount)} until ${fdate(t.until)}: ${t.status==='pending'?'waiting for Management':t.status}</div>`).join('')}</div></details></div>`}).join('')}`;
};
function visitResult(v){return v.status==='missed'?pill('Not visited','bad'):v.result==='order'?pill('Order taken','good'):v.result==='both'?pill('Order and payment','good'):v.result==='payment'?pill('Money collected','acc'):v.result==='noorder'?pill('No order: '+v.reason,'warn'):v.status==='in'?pill('You are here','info'):pill('To visit','')}

/* ---- trips ---- */
V.trips=()=>{
  const list=S.trips.filter(inVis).sort((a,b)=>({ontrip:0,planned:1,closed:2}[a.status]-{ontrip:0,planned:1,closed:2}[b.status])||a.date-b.date);
  return `${head('trips','Minibus and upcountry trips','Load the van, sell at each stop, then close the trip.',['mgmt','sales'].includes(U().role)?'<button class="btn pri" data-act="trip-new">Plan a trip</button>':'')}
  <div class="grid">${list.map(t=>`<button class="card pick" data-go="trip" data-p="${t.no}" style="text-align:left"><div class="row" style="justify-content:space-between;width:100%"><b class="lg">${t.type==='minibus'?'Minibus':'Upcountry'}: ${esc(t.route)}</b>${pill(...{planned:['Waiting to load','info'],ontrip:['On the road','acc'],closed:['Closed','good']}[t.status])}</div><span class="small muted">${coTag(t.co)} · ${fday(t.date)} · ${esc(t.staff)}</span><span class="small">${t.status==='planned'?sum(t.lines.map(l=>l.plan))+' cartons to load':`Sold ${sum(t.lines.map(l=>l.sold))} of ${sum(t.lines.map(l=>l.loaded))} cartons · ${money(sum(t.sales.map(s=>s.amount)))}`}</span></button>`).join('')}</div>`;
};
V.trip=()=>{
  const t=trip(S.ui.p);if(!t)return'';const ch=t.type==='minibus'?'minibus':'upcountry';const L=t.lines;let act='';
  if(t.status==='planned')act=`<div class="actionbox"><h2>Load the van</h2>${gate(['wh'],t)||`<div class="list">${L.map((l,i)=>`<div class="li"><span>${esc(SKU[l.sku].brand)} ${esc(SKU[l.sku].pack)}</span><span class="row"><input id="tq-${i}" class="inp" type="number" value="${l.plan}" style="width:80px"> ctn</span></div>`).join('')}</div><label class="field"><span>Vehicle</span>${sel('tl-veh',VEHICLES,t.vehicle)}</label><button class="btn pri huge" data-act="trip-load" data-no="${t.no}">Loaded, van has left</button>`}</div>`;
  if(t.status==='ontrip'){
    const mode=S.ui.tm||'';
    const custs=CUSTS.filter(c=>c.walkin||c.ch===ch&&c.cr[t.co]);const ts=S.ui.ts||(S.ui.ts={cust:custs[0].id});if(!custs.some(c=>c.id===ts.cust))ts.cust=custs[0].id;
    act=gate(['sales'],t)||`<div class="choices"><button class="choice ${mode==='sale'?'on':''}" data-act="tm" data-v="sale">Record a sale</button><button class="choice ${mode==='close'?'on':''}" data-act="tm" data-v="close">End the ${t.type==='minibus'?'day':'trip'}</button></div>
    ${mode==='sale'?`<div class="actionbox"><h2>Record a sale</h2><div class="fields"><label class="field"><span>Where?</span>${sel('ts-stop',t.stops,t.stops[0])}</label><label class="field"><span>Customer</span>${sel('ts-cust',custs.map(c=>[c.id,c.name]),ts.cust)}</label><label class="field"><span>Paid by</span>${sel('ts-pay',CUST[ts.cust].cashOnly?[['cash','Cash'],['airtel','Airtel Money']]:[['cash','Cash'],['airtel','Airtel Money'],['credit','Pay later']],'cash')}</label></div>
      <div class="list">${L.map((l,i)=>`<div class="li"><span>${esc(SKU[l.sku].brand)} ${esc(SKU[l.sku].pack)}<div class="small muted">${money(price(l.sku,ch))} · ${l.loaded-l.sold} on the van</div></span><input id="tsq-${i}" class="inp" type="number" min="0" value="0" style="width:80px"></div>`).join('')}</div>
      <label class="tick"><input type="checkbox" id="ts-cash2"> <span><b>2% full cash discount</b><span class="small muted" style="display:block">Only when paid fully in cash</span></span></label><button class="btn pri huge" data-act="trip-sale" data-no="${t.no}">Save sale</button></div>`:''}
    ${mode==='close'?`<div class="actionbox"><h2>End the ${t.type==='minibus'?'day':'trip'}</h2><p class="muted" style="margin:0">Count what came back and the cash.</p><div class="list">${L.map((l,i)=>`<div class="li"><span>${esc(SKU[l.sku].brand)} ${esc(SKU[l.sku].pack)}<div class="small muted">Should come back: ${l.loaded-l.sold}</div></span><span class="row"><input id="tr-${i}" data-tr="${i}" class="inp" type="number" value="${l.loaded-l.sold}" style="width:80px"><span class="small" id="tm-${i}"></span></span></div>`).join('')}</div>
      <label class="field"><span>Cash counted (should be ${money(sum(t.sales.filter(s=>s.pay==='cash').map(s=>s.amount)))})</span><input id="tc-cash" class="inp big" inputmode="numeric" value="${sum(t.sales.filter(s=>s.pay==='cash').map(s=>s.amount))}"></label><button class="btn pri huge" data-act="trip-close" data-no="${t.no}">Close</button></div>`:''}`;
  }
  return `<div class="head"><div><h1>${t.type==='minibus'?'Minibus':'Upcountry'}: ${esc(t.route)}${phaseTag('trips')}</h1><p>${coTag(t.co)} · ${fday(t.date)} · ${esc(t.vehicle)} · ${esc(t.staff)}</p></div></div>
  ${t.status==='closed'?big(`<b>Trip closed.</b> Cash should be ${money(t.expected)}, counted ${money(t.counted)}${t.diff?` (${money(t.diff)} different)`:''}. ${sum(L.map(l=>l.missing))?sum(L.map(l=>l.missing))+' cartons missing.':'Stock matches.'}`,t.diff||sum(L.map(l=>l.missing))?'warn':'good'):''}
  ${act}
  <div class="card"><h2>On this trip</h2><div class="list">${L.map(l=>`<div class="li"><span>${esc(SKU[l.sku].brand)} ${esc(SKU[l.sku].pack)}</span><span class="small">${t.status==='planned'?l.plan+' to load':`${l.sold} sold of ${l.loaded}${t.status==='closed'?` · ${l.ret} back`:''}`}</span></div>`).join('')}</div></div>
  ${t.sales.length?`<div class="card"><h2>Sales</h2><div class="list">${t.sales.map(s=>`<div class="li"><span>${esc(CUST[s.cust].name)} · ${esc(s.stop)}<div class="small muted">${fdt(s.at)} · ${PAY[s.pay]}</div></span><span class="num">${money(s.amount)}</span></div>`).join('')}</div></div>`:''}
  ${t.advance?.length?`<div class="card"><h2>Orders already given</h2>${t.advance.map(a=>`<div class="small">${esc(a[0])}: ${esc(a[1])}</div>`).join('')}</div>`:''}`;
};

/* ---- collect money ---- */
V.collections=()=>{
  const cos=visCos();const r=S.ui.rc||(S.ui.rc={cust:'',co:'',mode:'cash',amount:'',ref:''});
  const canDo=['mgmt','sales','fin'].includes(U().role);
  if(!r.cust){const list=CUSTS.filter(c=>!c.walkin&&cos.some(x=>c.cr[x])).map(c=>({c,od:sum(cos.filter(x=>c.cr[x]).map(x=>credit(c.id,x).overdue)),out:sum(cos.filter(x=>c.cr[x]).map(x=>credit(c.id,x).outstanding))})).filter(x=>x.out>0).sort((a,b)=>b.od-a.od);
    return `${head('collections','Collect money','Who is paying?')}<div class="picklist">${list.map(x=>`<button class="pick" data-act="rc-cust" data-id="${x.c.id}"><b>${esc(x.c.name)}</b><span class="small">Owes ${money(x.out)}${x.od?` · <b style="color:var(--bad)">${money(x.od)} late</b>`:''}</span></button>`).join('')}</div>`}
  const c=CUST[r.cust];const ccos=cos.filter(x=>c.cr[x]);if(!ccos.includes(r.co))r.co=ccos[0];const cr=credit(c.id,r.co);
  const v=r.visit&&S.visits.find(x=>x.id===r.visit);
  return `${head('collections','Collect money')}
  <div class="card grid"><b class="lg">${esc(c.name)}</b>${ccos.length>1?`<div class="choices">${ccos.map(x=>`<button class="choice ${x===r.co?'on':''}" data-act="rc-co" data-v="${x}">${esc(CO[x].name)}</button>`).join('')}</div>`:`<span>${coTag(r.co)}</span>`}
   ${big(`Owes <b>${money(cr.outstanding)}</b>${cr.overdue?` · <b>${money(cr.overdue)} is late</b>`:''}`,cr.overdue?'bad':'info')}
   ${canDo?`<label class="field"><span>How much did they pay? (MWK)</span><input id="rc-amt" class="inp huge-input" inputmode="numeric" value="${esc(r.amount)}" placeholder="0"></label>
   <b>How did they pay?</b><div class="choices">${['cash','bank','airtel'].map(k=>`<button class="choice ${r.mode===k?'on':''}" data-act="rc-mode" data-v="${k}">${PAY[k]}</button>`).join('')}</div>
   ${r.mode!=='cash'?`<label class="field"><span>Transaction number</span><input id="rc-ref" class="inp" value="${esc(r.ref)}"></label>`:''}
   <button class="btn pri huge" data-act="receipt" id="rc-save" ${+r.amount>0?'':'disabled'}>Save payment</button>
   <p class="small muted" style="margin:0">The oldest invoices are paid first. The payment goes to Zoho Books.${r.mode==='cash'?' Keep the cash safe until you hand it to Mr. Raza Ali.':''}</p>`:''}
   ${v?'':'<button class="btn sm" data-act="rc-reset" style="justify-self:start">Choose another customer</button>'}</div>`;
};

/* ---- cash handover / count ---- */
V.cash=()=>{
  const u=U();const held={};S.receipts.filter(x=>inVis(x)&&x.custody==='with'&&(u.role!=='sales'||x.collector===S.ui.user)).forEach(x=>{const k=x.collector+'|'+x.co;held[k]=held[k]||{u:x.collector,co:x.co,amt:0,n:0};held[k].amt+=x.amount;held[k].n++});
  const subs=S.handovers.filter(h=>inVis(h)&&h.status==='submitted'&&(u.role!=='sales'||h.collector===S.ui.user));
  const done=S.handovers.filter(h=>inVis(h)&&h.status==='confirmed'&&(u.role!=='sales'||h.collector===S.ui.user)).slice(0,5);
  const giveCards=Object.values(held).map(x=>`<div class="card grid"><b class="lg">${u.role==='sales'?'You have':esc(USERS[x.u].name)+' has'} ${money(x.amt)} cash</b><span class="small muted">${esc(CO[x.co].name)} · from ${plural(x.n,'payment')}</span>${u.role==='sales'||u.role==='mgmt'?`<button class="btn pri huge" data-act="handover" data-u="${x.u}" data-co="${x.co}">I gave it to Mr. Raza Ali</button>`:''}</div>`).join('');
  const countCards=subs.map(h=>`<div class="card grid"><b class="lg">${esc(USERS[h.collector].name)} brought ${money(h.amount)}</b><span class="small muted">${esc(CO[h.co].name)} · ${fdt(h.at)}</span>${gate(['fin'],h,'Counting')||`<label class="field"><span>How much did you count? (MWK)</span><input id="ho-${h.no}" class="inp huge-input" inputmode="numeric" value="${h.amount}"></label><button class="btn pri huge" data-act="confirm-ho" data-no="${h.no}">Counted, confirm</button>`}</div>`).join('');
  return `${head('cash',u.role==='fin'?'Count cash':'Cash handover','Cash stays the sales manager’s responsibility until Mr. Raza Ali counts it and confirms.')}
  ${u.role==='fin'?(countCards?`<div class="grid">${countCards}</div>`:'<div class="card empty">No cash waiting to be counted.</div>'):`
   <h2>${u.role==='sales'?'Your cash':'Cash with sales managers'}</h2><div class="grid">${giveCards||'<div class="card empty">No cash to hand over.</div>'}</div>
   ${subs.length?`<h2>Waiting for Mr. Raza Ali to count</h2><div class="grid">${countCards}</div>`:''}`}
  ${done.length?`<details class="card"><summary>Recently counted</summary><div class="list" style="margin-top:8px">${done.map(h=>`<div class="li"><span>${esc(USERS[h.collector].name)} · ${fdt(h.confAt)}</span><span class="num">${money(h.counted)}${h.diff?` <span style="color:var(--bad)">(${money(h.diff)})</span>`:''}</span></div>`).join('')}</div></details>`:''}`;
};

function orderRow(o){const[s,k]=STATUS[o.status];return `<tr class="click" data-go="order" data-p="${o.no}"><td class="mono">${o.no}</td><td>${coTag(o.co)}</td><td>${esc(CUST[o.cust].name)}<div class="small muted">${CH[o.ch].label} · ${esc(o.src||'')}</div></td><td>${fdt(o.at)}</td><td>${pill(s,k)}</td><td class="num">${money(orderTotal(o))}</td></tr>`}
function orderTable(list,empty){return list.length?`<div class="tbl-wrap"><table><thead><tr><th>Order</th><th>Company</th><th>Customer</th><th>Booked</th><th>Status</th><th class="num">Value</th></tr></thead><tbody>${list.map(orderRow).join('')}</tbody></table></div>`:`<div class="empty">${empty||'No orders'}</div>`}
V.orders=()=>{

  const F={open:['In progress',o=>!['invoiced','rejected','cancelled'].includes(o.status)],...Object.fromEntries(Object.entries(STATUS).map(([k,[l]])=>[k,[l,o=>o.status===k]])),all:['All',()=>true]};

  return `${head('orders','Orders','Every order keeps its full story: who booked, approved, picked, loaded, delivered and invoiced it.',['mgmt','sales'].includes(U().role)?'<button class="btn pri" data-go="neworder">New order</button>':'')}
  <div class="row"><input id="o-search" class="inp" placeholder="Search customer or order number" value="${esc(S.ui.q||'')}" style="flex:1;min-width:200px"></div>
  <div class="chips">${Object.entries(F).map(([k,[l]])=>`<button class="chip ${k===f?'on':''}" data-go="orders" data-p="${k}">${l} <span class="mono">${vis.filter(F[k][1]).length}</span></button>`).join('')}</div>

};

/* ---- approvals ---- */
function traceHTML(no){
  const b=S.batches.find(x=>x.no===no);const ev=[];
  S.grn.filter(g=>g.batch===no).forEach(g=>ev.push([g.at,'Received',`${g.qty} ctn into ${FAC[CO[g.co].fac]} (${g.no})`]));
  S.orders.forEach(o=>o.lines.forEach(l=>(l.alloc||[]).filter(a=>a.b===no&&a.used).forEach(a=>ev.push([o.loadedAt,'Sent to '+CUST[o.cust].name,`${a.used} ctn · ${o.no} · ${o.dn||''}`]))));
  S.trips.forEach(t=>t.lines.forEach(l=>(l.batches||[]).filter(a=>a.b===no).forEach(a=>ev.push([t.loadAt,`Loaded on trip ${t.no}`,`${a.q} ctn · ${t.route}`]))));
  S.returns.filter(r=>r.batch===no).forEach(r=>ev.push([r.at,'Returned by '+CUST[r.cust].name,`${r.qty} ctn · ${r.reason}`]));
  S.adj.filter(a=>a.batch===no).forEach(a=>ev.push([a.at,'Adjustment ('+a.status+')',`${a.qty} ctn · ${a.reason}`]));
  ev.sort((x,y)=>x[0]-y[0]);
  return `<h2>Batch ${esc(no)}</h2><p class="muted" style="margin:0">${esc(skuName(b.sku))} · made ${fdate(b.mfg)} · expires ${fdate(b.exp)} · ${b.qty} ctn left · ${batchState(b)[0]}</p>
  <div class="tbl-wrap"><table><thead><tr><th>When</th><th>What</th><th>Detail</th></tr></thead><tbody>${ev.map(e=>`<tr><td class="small">${fdate(e[0])}</td><td>${esc(e[1])}</td><td class="small muted">${esc(e[2])}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---- reports ---- */
V.reports=()=>{
  const tab=S.ui.p||'sku';const per=S.ui.per||'30';const from=per==='mtd'?(()=>{const d=new Date(T0);d.setDate(1);return d.getTime()})():dOff(-+per);
  const inv=S.invoices.filter(i=>inVis(i)&&i.date>=from);const tot=sum(inv.map(i=>i.total))||1;
  const tabs={sku:'By product',customer:'By customer',salesman:'By salesman',channel:'By channel',aging:'Money owed (aging)',trips:'Trips',cash:'Daily cash and bank'};
  let body='';
  if(tab==='sku'){const g=groupSum(inv,l=>l.sku);const half=from+(T0-from)/2;const a=groupSum(inv.filter(i=>i.date<half),l=>l.sku),b=groupSum(inv.filter(i=>i.date>=half),l=>l.sku);const q={};inv.forEach(i=>i.lines.forEach(l=>q[l.sku]=(q[l.sku]||0)+l.qty));
    body=`<table><thead><tr><th>Product</th><th>Brand</th><th class="num">Cartons</th><th class="num">Sales</th><th class="num">Share</th><th>Trend</th></tr></thead><tbody>${Object.entries(g).sort((x,y)=>y[1]-x[1]).map(([s,v])=>{const tr=(b[s]||0)-(a[s]||0);return `<tr><td>${esc(SKU[s].prod)} ${esc(SKU[s].pack)}<div class="small mono muted">${s}</div></td><td>${esc(SKU[s].brand)}</td><td class="num">${q[s]}</td><td class="num">${money(v)}</td><td class="num">${Math.round(v/tot*100)}%</td><td>${tr<-(a[s]||0)*.25?pill('Falling','bad'):tr>(a[s]||0)*.25?pill('Rising','good'):pill('Steady','')}</td></tr>`}).join('')}</tbody></table>`}
  if(tab==='customer'){const g={};inv.forEach(i=>{g[i.cust]=g[i.cust]||{v:0,n:0,last:0};g[i.cust].v+=i.total;g[i.cust].n++;g[i.cust].last=Math.max(g[i.cust].last,i.date)});
    body=`<table><thead><tr><th>Customer</th><th>Type</th><th class="num">Invoices</th><th class="num">Sales</th><th>Last bought</th><th class="num">Owes now</th></tr></thead><tbody>${CUSTS.filter(c=>!c.walkin).map(c=>[c,g[c.id]||{v:0,n:0,last:0}]).sort((x,y)=>y[1].v-x[1].v).map(([c,x])=>`<tr class="click" data-go="customer" data-p="${c.id}"><td>${esc(c.name)}${x.v<tot*.03?' '+pill('Low sales','warn'):''}</td><td>${CH[c.ch].label}</td><td class="num">${x.n}</td><td class="num">${money(x.v)}</td><td>${x.last?fdate(x.last):'–'}</td><td class="num">${money(sum(S.invoices.filter(i=>i.cust===c.id&&inVis(i)).map(bal)))}</td></tr>`).join('')}</tbody></table>`}
  if(tab==='salesman'){body=`<table><thead><tr><th>Salesman</th><th class="num">Sales</th><th class="num">Target (month)</th><th class="num">Collected</th><th class="num">Visits</th><th class="num">Strike rate</th><th class="num">New customers</th></tr></thead><tbody>${['abbas','kashif'].map(us=>{const cs=USERS[us].cos.filter(c=>visCos().includes(c));if(!cs.length)return'';const v=sum(inv.filter(i=>cs.includes(i.co)).map(i=>i.total));const col=sum(S.receipts.filter(r=>cs.includes(r.co)&&r.at>=from).map(r=>r.amount));const vs=S.visits.filter(x=>x.user===us&&x.day>=from&&x.status==='done');const pr=vs.filter(x=>['order','both'].includes(x.result)).length;return `<tr><td>${esc(USERS[us].name)}<div class="small muted">${cs.map(c=>CO[c].name).join(', ')}</div></td><td class="num">${money(v)}</td><td class="num">${money(sum(cs.map(c=>sum(Object.values(S.tg[c])))))}</td><td class="num">${money(col)}</td><td class="num">${vs.length}</td><td class="num">${vs.length?Math.round(pr/vs.length*100):0}%</td><td class="num">${S.newcust.filter(n=>n.by===USERS[us].name&&n.status==='approved').length}</td></tr>`}).join('')}</tbody></table>`}
  if(tab==='channel'){const cos=visCos();body=`<table><thead><tr><th>Channel</th>${cos.map(c=>`<th class="num">${CO[c].name}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${Object.keys(CH).map(k=>{const row=cos.map(c=>sum(inv.filter(i=>i.co===c&&chOfInv(i)===k).map(i=>i.total)));return `<tr><td>${CH[k].label}</td>${row.map(v=>`<td class="num">${money(v)}</td>`).join('')}<td class="num"><b>${money(sum(row))}</b></td></tr>`}).join('')}</tbody></table>`}
  if(tab==='aging'){const rows=[];CUSTS.forEach(c=>visCos().forEach(co=>{const b=[0,0,0,0,0];S.invoices.filter(i=>i.cust===c.id&&i.co===co&&bal(i)>0).forEach(i=>{const d=Math.floor((T0-i.due)/DAY);b[d<=0?0:d<=30?1:d<=60?2:d<=90?3:4]+=bal(i)});if(sum(b))rows.push([c,co,b])}));
    body=`<table><thead><tr><th>Customer</th><th>Company</th><th class="num">Not due</th><th class="num">1–30 days</th><th class="num">31–60</th><th class="num">61–90</th><th class="num">Over 90</th><th class="num">Total</th></tr></thead><tbody>${rows.sort((x,y)=>sum(y[2].slice(1))-sum(x[2].slice(1))).map(([c,co,b])=>`<tr class="click" data-go="customer" data-p="${c.id}"><td>${esc(c.name)}</td><td>${coTag(co)}</td>${b.map((v,i)=>`<td class="num" style="color:${i&&v?'var(--bad)':'inherit'}">${v?money(v):'–'}</td>`).join('')}<td class="num"><b>${money(sum(b))}</b></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Total</td>${[0,1,2,3,4].map(i=>`<td class="num">${money(sum(rows.map(r=>r[2][i])))}</td>`).join('')}<td class="num">${money(sum(rows.map(r=>sum(r[2]))))}</td></tr></tfoot></table>`}
  if(tab==='trips')body=`<table><thead><tr><th>Trip</th><th>Route</th><th class="num">Loaded</th><th class="num">Sold</th><th class="num">Back</th><th class="num">Sales</th><th class="num">Cash difference</th></tr></thead><tbody>${S.trips.filter(inVis).map(t=>`<tr class="click" data-go="trip" data-p="${t.no}"><td class="mono">${t.no}<div class="small">${fday(t.date)}</div></td><td>${esc(t.route)}</td><td class="num">${sum(t.lines.map(l=>l.loaded))}</td><td class="num">${sum(t.lines.map(l=>l.sold))}</td><td class="num">${t.status==='closed'?sum(t.lines.map(l=>l.ret)):'–'}</td><td class="num">${money(sum(t.sales.map(s=>s.amount)))}</td><td class="num">${t.status==='closed'?money(t.diff):'open'}</td></tr>`).join('')}</tbody></table>`;
  if(tab==='cash'){const days=[];for(let d=-6;d<=0;d++)days.push(dOff(d));body=`<table><thead><tr><th>Day</th><th class="num">Sales</th><th class="num">Cash</th><th class="num">Bank</th><th class="num">Airtel Money</th><th class="num">Total collected</th></tr></thead><tbody>${days.reverse().map(d=>{const rs=S.receipts.filter(r=>inVis(r)&&r.at>=d&&r.at<d+DAY);const m=k=>sum(rs.filter(r=>r.mode===k).map(r=>r.amount));return `<tr><td>${fday(d)}</td><td class="num">${money(sum(S.invoices.filter(i=>inVis(i)&&i.date>=d&&i.date<d+DAY).map(i=>i.total)))}</td><td class="num">${money(m('cash'))}</td><td class="num">${money(m('bank'))}</td><td class="num">${money(m('airtel'))}</td><td class="num"><b>${money(sum(rs.map(r=>r.amount)))}</b></td></tr>`}).join('')}</tbody></table>`}
  return `${head('reports','Reports','Pick a report. Tap a row to open the customer, trip or order behind it. Every report can be downloaded to Excel in the real app.')}
  <div class="chips">${Object.entries(tabs).map(([k,l])=>`<button class="chip ${k===tab?'on':''}" data-go="reports" data-p="${k}">${l}</button>`).join('')}</div>
  ${['aging','trips','cash'].includes(tab)?'':`<div class="chips">${[['mtd','This month'],['30','Last 30 days'],['7','Last 7 days']].map(([k,l])=>`<button class="chip ${k===per?'on':''}" data-act="per" data-v="${k}">${l}</button>`).join('')}</div>`}
  <div class="panel"><div class="tbl-wrap">${body}</div></div>`;
};

  if(q.length>=2){

    const custs=allowed('customer')?CUSTS.filter(c=>!c.walkin&&visCos().some(x=>c.cr[x])&&(hit(c.name)||hit(c.loc)||hit(c.phone))):[];
    const ords=S.orders.filter(o=>inVis(o)&&(hit(o.no)||hit(CUST[o.cust].name)||(o.dn&&hit(o.dn))));
    const invs=allowed('invoices')?S.invoices.filter(i=>inVis(i)&&(hit(i.no)||hit(CUST[i.cust].name))):[];

      ${got?`<button class="btn pri huge" data-act="handover" data-u="${us}" data-co="${co}">I gave ${money(got-exT)} to Mr. Raza Ali</button>`:''}`:''}

/* ---- order lines: ordered, planned, loaded, delivered, balance ---- */
function ls(o,l){let plan=0,onveh=0,loaded=0;
  const add=(st,it)=>{if(it.order!==o.no||it.sku!==l.sku)return;if(st==='planned')plan+=it.q;else{loaded+=it.q;if(!it.done)onveh+=it.q}};
  S.lps.forEach(lp=>lp.items.forEach(it=>add(lp.status,it)));
  S.trips.forEach(t=>(t.adv||[]).forEach(it=>add(t.status,it)));
  const deliv=l.deliv||0;const shut=o.closed||o.status==='cancelled';
  return{qty:l.qty,plan,onveh,loaded,deliv,bal:shut?0:Math.max(0,l.qty-deliv),free:shut||o.status==='hold'?0:Math.max(0,l.qty-deliv-plan-onveh)};
}
function refresh(o){if(!o||o.closed||['cancelled','hold'].includes(o.status))return;
  const st=o.lines.map(l=>ls(o,l));const bal=sum(st.map(x=>x.bal));
  o.status=bal===0?'done':st.some(x=>x.onveh)?'onveh':st.some(x=>x.plan)?'planned':sum(st.map(x=>x.deliv))?'part':'open';
}
function reserveLine(o,l){
  (l.alloc||[]).forEach(a=>{const b=S.batches.find(x=>x.no===a.b);if(b)b.res=Math.max(0,b.res-a.q)});l.alloc=[];
  const st=ls(o,l);let need=(o.closed||o.status==='cancelled')?0:Math.max(0,l.qty-st.deliv-st.onveh);
  const minExp=dOff(S.settings.shelf[CUST[o.cust].ch]||30);
  batchesFor(l.sku).filter(sellable).filter(b=>b.exp>=minExp).sort((a,b)=>a.exp-b.exp).forEach(b=>{if(need<=0)return;const t=Math.min(need,b.qty-b.res-(b.tr||0));if(t>0){b.res+=t;need-=t;l.alloc.push({b:b.no,q:t})}});
  l.shortStock=need;
}
function toWarehouse(o,why){allocate(o);o.lines.forEach(l=>{l.deliv=0});o.status='open';o.invs=[];o.dns=[];o.hist.push({at:now(),by:'System',t:'Confirmed',d:'Stock reserved, oldest expiry first. Waiting for '+USERS[CO[o.co].mgr].name+' to put it on a vehicle.'})}
function dropFromPlans(o){S.lps.filter(lp=>lp.status==='planned').forEach(lp=>{lp.items=lp.items.filter(i=>i.order!==o.no)});S.trips.filter(t=>t.status==='planned').forEach(t=>{t.adv=(t.adv||[]).filter(i=>i.order!==o.no)})}
function cancelOrder(o){dropFromPlans(o);o.status='cancelled';o.lines.forEach(l=>reserveLine(o,l));o.hist.push({at:now(),by:me(),t:'Cancelled',d:'Reserved stock released'});audit('Order cancelled',o.no,'Stock reservation released')}
function closeOrder(o){const left=sum(o.lines.map(l=>ls(o,l).bal));dropFromPlans(o);o.closed=true;o.status='done';o.lines.forEach(l=>reserveLine(o,l));o.hist.push({at:now(),by:me(),t:'Marked as delivered',d:left?`The open balance of ${left} cartons was closed and its stock released`:'Order closed'});audit('Order marked as delivered',o.no,left?left+' ctn balance closed':'')}
function holdOrder(o,on){if(on){dropFromPlans(o);o.status='hold';o.hist.push({at:now(),by:me(),t:'Put on hold',d:'Cannot be loaded until released. Stock stays reserved.'})}else{o.status='open';refresh(o);o.hist.push({at:now(),by:me(),t:'Hold released',d:'Can be loaded again'})}audit(on?'Order put on hold':'Order hold released',o.no,'')}
function editOrder(o,qtys){const ch=[];o.lines.forEach((l,i)=>{const st=ls(o,l);const min=st.deliv+st.onveh+st.plan;const q=Math.max(min,qtys[i]);if(q!==l.qty){ch.push(`${SKU[l.sku].brand} ${SKU[l.sku].pack}: ${l.qty} → ${q}`);l.qty=q}reserveLine(o,l)});
  if(ch.length){o.hist.push({at:now(),by:me(),t:'Changed',d:ch.join('; ')});audit('Order changed',o.no,ch.join('; '))}refresh(o);return ch.length}

/* ---- loading plans: one vehicle, one facility, many customers ---- */
const lpOf=no=>S.lps.find(x=>x.no===no);
function newLP(fac){const lp={no:nextShared('LP'),fac,co:FACCOS[fac][0],cos:FACCOS[fac],vehicle:VEHICLES[0],driver:DRIVERS[0],by:me(),at:now(),status:'planned',items:[],log:[]};S.lps.unshift(lp);audit('Loading plan started',lp.no,FAC[fac]);return lp}
function lpSet(lp,ono,sku,q){const o=order(ono);let it=lp.items.find(i=>i.order===ono&&i.sku===sku);const old=it?it.q:0;if(q===old)return false;
  if(!it){it={order:ono,sku,cust:o.cust,co:o.co,q:0,deliv:0,done:false};lp.items.push(it)}it.q=q;if(!q)lp.items=lp.items.filter(x=>x!==it);
  lp.log.push({at:now(),by:me(),wh:false,sku,ono,from:old,to:q});refresh(o);return true}
function whSku(lp,sku,to,why){const its=lp.items.filter(i=>i.sku===sku);const cur=sum(its.map(i=>i.q));let diff=to-cur;if(!diff)return 0;
  if(diff<0){its.slice().reverse().forEach(it=>{if(!diff)return;const t=Math.min(it.q,-diff);it.q-=t;diff+=t})}
  else its.forEach(it=>{if(!diff)return;const o=order(it.order);const room=ls(o,o.lines.find(x=>x.sku===sku)).free;const t=Math.min(room,diff);it.q+=t;diff-=t});
  const real=sum(its.map(i=>i.q));lp.items=lp.items.filter(i=>i.q>0);
  lp.log.push({at:now(),by:me(),wh:true,sku,from:cur,to:real,why,seen:false});
  audit('Loading changed by the warehouse',lp.no,`${skuName(sku)}: ${cur} → ${real} ctn. Reason: ${why}`);its.forEach(i=>refresh(order(i.order)));return to-real}
function moveToVan(o,l,it){it.batches=[];let need=it.q;
  (l.alloc||[]).forEach(a=>{if(need<=0)return;const b=S.batches.find(x=>x.no===a.b);if(!b)return;const t=Math.min(need,a.q);a.q-=t;b.res=Math.max(0,b.res-t);b.tr=(b.tr||0)+t;need-=t;it.batches.push({b:b.no,q:t})});
  l.alloc=(l.alloc||[]).filter(a=>a.q>0);
  if(need>0)batchesFor(l.sku).filter(sellable).sort((a,b)=>a.exp-b.exp).forEach(b=>{if(need<=0)return;const t=Math.min(need,b.qty-b.res-(b.tr||0));if(t>0){b.tr=(b.tr||0)+t;need-=t;it.batches.push({b:b.no,q:t})}});
  it.q-=need;
}
function lpLoad(lp){lp.status='loaded';lp.loadAt=now();lp.dn=nextShared('DN');lp.gp=nextShared('GP');
  lp.items.forEach(it=>{const o=order(it.order);moveToVan(o,o.lines.find(x=>x.sku===it.sku),it)});lp.items=lp.items.filter(i=>i.q>0);
  [...new Set(lp.items.map(i=>i.order))].forEach(no=>{const o=order(no);o.dns=o.dns||[];o.dns.push(lp.dn);o.loadedAt=o.loadedAt||now();refresh(o);
    o.hist.push({at:now(),by:me(),t:'Loaded',d:`${sum(lp.items.filter(i=>i.order===no).map(i=>i.q))} ctn on ${lp.vehicle} · delivery note ${lp.dn}. Stock is In transit.`})});
  audit('Loaded; delivery note and gate pass made',lp.no,`${lp.dn}, ${lp.gp}, ${lp.vehicle}, ${sum(lp.items.map(i=>i.q))} ctn`);
}
function lpGate(lp){lp.status='out';lp.outAt=now();audit('Vehicle left the gate',lp.no,`${lp.gp} · ${lp.vehicle}`)}
function deliverItem(o,l,it,d){it.deliv=d;it.done=true;let left=d;
  (it.batches||[]).forEach(bb=>{const b=S.batches.find(x=>x.no===bb.b);if(!b)return;b.tr=Math.max(0,(b.tr||0)-bb.q);const t=Math.min(left,bb.q);b.qty-=t;left-=t;const back=bb.q-t;
    if(back>0&&!o.closed&&o.status!=='cancelled'){b.res+=back;l.alloc=l.alloc||[];l.alloc.push({b:b.no,q:back})}});
  l.deliv=(l.deliv||0)+d;
}
function makeInvoice(co,cust,lines,pay,ref,collector){
  const c=CUST[cust];const terms=(c.cr[co]||[0,0])[1];
  const inv={no:nextNo(co,'INV'),co,cust,order:ref,pay,date:now(),due:pay==='credit'?T0+Math.floor((now()-T0)/DAY)*DAY+terms*DAY:now(),lines,total:sum(lines.map(lineNet)),paid:0,cn:0};
  S.invoices.unshift(inv);audit('Invoice made',inv.no,`${c.name} · ${money(inv.total)}`,'System');
  if(pay!=='credit')receipt({co,cust,amount:inv.total,mode:pay,ref:'Paid on delivery',collector,inv:inv.no},true);
  return inv;
}
/* driver confirms one customer: items are LP or trip advance items */
function dropItems(kind,ref,cust){const x=kind==='lp'?lpOf(ref):trip(ref);if(!x)return[];return (kind==='lp'?x.items:(x.adv||[])).filter(i=>i.cust===cust)}
function deliverDrop(kind,ref,cust,qtys,recv){
  const x=kind==='lp'?lpOf(ref):trip(ref);const items=dropItems(kind,ref,cust).filter(i=>!i.done);const invs=[];const byO={};
  items.forEach((it,i)=>{const o=order(it.order);const l=o.lines.find(z=>z.sku===it.sku);const d=Math.max(0,Math.min(it.q,qtys?qtys[i]:it.q));deliverItem(o,l,it,d);(byO[o.no]=byO[o.no]||[]).push([l,it,d])});
  Object.entries(byO).forEach(([no,arr])=>{const o=order(no);const lines=arr.filter(a=>a[2]>0).map(([l,,d])=>({sku:l.sku,qty:d,price:l.price,disc:l.disc,why:l.why}));
    const back=sum(arr.map(a=>a[1].q-a[2]));o.delAt=now();o.recv=recv;
    o.hist.push({at:now(),by:me(),t:'Delivered',d:`Received by ${recv}${kind==='lp'?' · '+x.dn:' · trip '+x.no}${back?` · ${back} ctn not taken, back on the order balance`:''}`});
    if(lines.length){const inv=makeInvoice(o.co,o.cust,lines,o.pay,o.no,o.salesman);inv.lp=kind==='lp'?x.no:null;inv.dn=kind==='lp'?x.dn:null;inv.trip=kind==='trip'?x.no:null;o.invs=o.invs||[];o.invs.push(inv.no);o.inv=o.inv||inv.no;invs.push(inv);
      o.hist.push({at:now(),by:'System',t:'Invoice made',d:`${inv.no} for what was delivered${o.pay==='credit'?', due '+fdate(inv.due):''}`})}
    refresh(o)});
  if(kind==='lp'&&x.items.every(i=>i.done)){x.status='done';x.doneAt=now()}
  if(kind==='trip'){const tot=sum(invs.map(i=>i.total));if(invs.length)x.sales.push({at:now(),cust,stop:'Advance order',invs:invs.map(i=>i.no),inv:invs[0].no,pay:order(items[0].order).pay,amount:tot,adv:true})}
  audit('Delivery confirmed',kind==='lp'?x.dn:x.no,`${CUST[cust].name} · received by ${recv}`);
  return invs;
}

/* ---- trips: both companies of a facility, invoice at the stop, advance orders, expense float ---- */
function tripLoad(t,loaded,veh){
  t.lines.forEach((l,i)=>{l.loaded=loaded[i];l.batches=[];let need=l.loaded;
    batchesFor(l.sku).filter(sellable).sort((a,b)=>a.exp-b.exp).forEach(b=>{if(need<=0)return;const take=Math.min(need,b.qty-b.res-(b.tr||0));if(take>0){b.tr=(b.tr||0)+take;need-=take;l.batches.push({b:b.no,q:take,sold:0})}})});
  t.vehicle=veh||t.vehicle;t.gp=nextShared('GP');t.status='ontrip';t.loadAt=now();
  (t.adv||[]).forEach(it=>{const o=order(it.order);moveToVan(o,o.lines.find(x=>x.sku===it.sku),it)});
  [...new Set((t.adv||[]).map(i=>i.order))].forEach(no=>{const o=order(no);refresh(o);o.hist.push({at:now(),by:me(),t:'Loaded',d:`On trip ${t.no} · ${t.vehicle}. Stock is In transit.`})});
  const adv=sum((t.adv||[]).map(i=>i.q));
  t.hist.push({at:now(),by:me(),t:'Loaded and left',d:`${sum(loaded)+adv} ctn on ${t.vehicle}${adv?` (${adv} for advance orders)`:''} · gate pass ${t.gp}. Stock is In transit.`});audit('Trip loaded',t.no,`${sum(loaded)+adv} ctn · ${t.gp}`);
}
function tripSale(t,cust,stop,qty,pay,cash2){
  const ch=t.type==='minibus'?'minibus':'upcountry';const cos=t.cos||[t.co];const invs=[];
  cos.forEach(co=>{const q={};Object.entries(qty).forEach(([s,n])=>{if(SKU[s].co===co&&n>0)q[s]=n});if(!Object.keys(q).length)return;
    const lines=buildLines({co,cust,pay,qty:q,cash2},ch);
    lines.forEach(l=>{const tl=t.lines.find(x=>x.sku===l.sku);tl.sold+=l.qty;let left=l.qty;
      (tl.batches||[]).forEach(a=>{if(left<=0)return;const b=S.batches.find(x=>x.no===a.b);const n=Math.min(left,a.q-a.sold);if(n>0&&b){a.sold+=n;b.tr=Math.max(0,(b.tr||0)-n);b.qty-=n;left-=n}})});
    const inv=makeInvoice(co,cust,lines,pay,t.no,CO[co].mgr);inv.trip=t.no;inv.stop=stop;invs.push(inv)});
  const total=sum(invs.map(i=>i.total));
  t.sales.push({at:now(),cust,stop,invs:invs.map(i=>i.no),inv:invs[0]&&invs[0].no,pay,amount:total});
  t.hist.push({at:now(),by:USERS[CO[t.co].mgr].name,t:'Sale at '+stop,d:`${CUST[cust].name} · ${money(total)} · ${PAY[pay]} · ${invs.map(i=>i.no).join(', ')}`});
  S.ui.lastInv=invs.map(i=>i.no);S.ui.lastInvTrip=t.no;
  return{total,invs,no:invs[0]&&invs[0].no};
}
function tripClose(t,ret,counted){
  t.lines.forEach((l,i)=>{l.ret=ret[i];l.missing=Math.max(0,l.loaded-l.sold-l.ret);let lost=l.missing;
    (l.batches||[]).forEach(a=>{const b=S.batches.find(x=>x.no===a.b);if(!b)return;const open=a.q-a.sold;b.tr=Math.max(0,(b.tr||0)-open);const x=Math.min(lost,open);b.qty-=x;lost-=x})});
  (t.adv||[]).filter(i=>!i.done).forEach(it=>{const o=order(it.order);deliverItem(o,o.lines.find(x=>x.sku===it.sku),it,0);o.hist.push({at:now(),by:me(),t:'Came back from the trip',d:`${it.q} ctn not delivered. Back on the order balance.`})});
  const fl=t.float||0,exT=sum((t.exps||[]).map(e=>e.amount));
  t.status='closed';t.closeAt=now();(t.adv||[]).forEach(i=>refresh(order(i.order)));
  t.cashSales=sum(t.sales.filter(s=>s.pay==='cash').map(s=>s.amount));t.expected=t.cashSales+fl-exT;t.counted=counted;t.diff=counted-t.expected;
  const lead=CO[t.co].mgr;
  if(exT>fl)S.expenses.push({id:'E-'+t.no,user:lead,co:t.co,amount:exT-fl,what:`Trip expenses over the float (${t.no})`,photo:null,at:now(),status:'open',pay:'cash'});
  if(fl>exT)S.cashx.push({id:'X-'+t.no,user:lead,co:t.co,amount:fl-exT,what:`Trip float not spent (${t.no})`,at:now(),custody:'with'});
  t.hist.push({at:now(),by:me(),t:'Trip closed',d:`Returned ${sum(ret)} ctn to stock. Cash expected ${money(t.expected)} (sales ${money(t.cashSales)} + float ${money(fl)} − expenses ${money(exT)}), counted ${money(counted)}.`});
  audit('Trip closed',t.no,`Cash diff ${money(t.diff)}; stock diff ${sum(t.lines.map(l=>l.missing))} ctn`);
}

/* ---- Airtel Money wallets: Mr. Abbas (F1) and Mr. Kashif (F2) ---- */
const WALLETS=['abbas','kashif'];
function airtelAdd(e){e.id='AM-'+String(S.airtel.length+1).padStart(4,'0');e.at=e.at||now();e.by=e.by||me();e.cr=e.cr||0;e.dr=e.dr||0;e.log=[{at:e.at,by:e.by,t:'Entered'}];S.airtel.push(e);
  audit('Airtel Money '+e.kind,e.id,`${USERS[e.wallet].name}'s wallet · ${e.cr?'+ '+money(e.cr):'− '+money(e.dr)} · ${e.desc}`,e.by);return e}
function walletBal(w,before){return S.wallets[w].open+sum(S.airtel.filter(e=>e.wallet===w&&(before==null||e.at<before)).map(e=>e.cr-e.dr))}
function walletRows(w){const es=S.airtel.filter(e=>e.wallet===w).sort((a,b)=>a.at-b.at);let run=S.wallets[w].open;return es.map(e=>{run+=e.cr-e.dr;return{e,bal:run}})}
function receipt(r,auto){
  let left=r.amount;const alloc=[];
  S.invoices.filter(i=>i.co===r.co&&i.cust===r.cust&&bal(i)>0).sort((a,b)=>(b.no===r.inv)-(a.no===r.inv)||a.date-b.date).forEach(i=>{if(left<=0)return;const a=Math.min(left,bal(i));i.paid+=a;left-=a;alloc.push([i.no,a])});
  const rc={no:nextNo(r.co,'RCT'),co:r.co,cust:r.cust,at:now(),amount:r.amount,mode:r.mode,ref:r.ref||'',alloc,unalloc:left,collector:r.collector||null,custody:r.mode==='cash'?'with':'na',trip:r.trip||null};
  S.receipts.unshift(rc);audit(auto?'Payment on delivery':'Payment recorded',rc.no,`${money(r.amount)} ${PAY[r.mode]}`,auto?'System':undefined);
  if(r.mode==='airtel')airtelAdd({wallet:CO[r.co].mgr,co:r.co,kind:'collection',desc:CUST[r.cust].name,ref:r.ref||'',rct:rc.no,cr:r.amount,status:'pending',by:auto&&r.collector?USERS[r.collector].name:me()});
  return rc;
}
function cashWith(u,co){return sum(S.receipts.filter(r=>r.custody==='with'&&r.collector===u&&(!co||r.co===co)).map(r=>r.amount))+sum(S.cashx.filter(x=>x.custody==='with'&&x.user===u&&(!co||x.co===co)).map(x=>x.amount))}
function handover2(u){
  const rs=S.receipts.filter(r=>r.custody==='with'&&r.collector===u),xs=S.cashx.filter(x=>x.custody==='with'&&x.user===u),ex=expOpen(u);if(!rs.length&&!xs.length)return null;
  const h={no:nextNo(USERS[u].cos[0],'HO'),co:USERS[u].cos[0],cos:USERS[u].cos,collector:u,at:now(),amount:sum(rs.map(r=>r.amount))+sum(xs.map(x=>x.amount)),exp:sum(ex.map(e=>e.amount)),exps:ex.map(e=>e.id),rcts:rs.map(r=>r.no),cxs:xs.map(x=>x.id),status:'submitted'};h.net=h.amount-h.exp;
  rs.forEach(r=>r.custody='submitted');xs.forEach(x=>x.custody='submitted');ex.forEach(e=>e.status='submitted');S.handovers.unshift(h);
  audit('Cash handed over',h.no,`${money(h.net)} (${money(h.amount)} cash, ${money(h.exp)} expenses) to Mr. Raza Ali`,USERS[u].name);return h;
}
function confirmHO(h,counted){
  h.status='confirmed';h.counted=counted;h.diff=counted-(h.net??h.amount);h.confAt=now();S.expenses.filter(e=>(h.exps||[]).includes(e.id)).forEach(e=>e.status='confirmed');
  S.receipts.filter(r=>h.rcts.includes(r.no)).forEach(r=>r.custody='confirmed');S.cashx.filter(x=>(h.cxs||[]).includes(x.id)).forEach(x=>x.custody='confirmed');
  audit('Cash received and counted',h.no,`Counted ${money(counted)}${h.diff?` (difference ${money(h.diff)})`:''}`,USERS.raza.name);
}
/* company and day breakup behind one total */
function cashBreak(rs,xs,ex){const g={};const add=(at,co,k,v)=>{const key=dayOf(at)+'|'+co;g[key]=g[key]||{d:dayOf(at),co,col:0,wd:0,ex:0};g[key][k]+=v};
  rs.forEach(r=>add(r.at,r.co,'col',r.amount));xs.forEach(x=>add(x.at,x.co,'wd',x.amount));ex.forEach(e=>add(e.at,e.co,'ex',e.amount));
  const rows=Object.values(g).sort((a,b)=>a.d-b.d||COS.indexOf(a.co)-COS.indexOf(b.co));const cos=[...new Set(rows.map(r=>r.co))];

  return `<div class="list">${cos.map(c=>{const rr=rows.filter(r=>r.co===c);return `<div class="li"><span>${coTag(c)}</span><b class="num">${money(sum(rr.map(r=>r.col+r.wd-r.ex)))}</b></div>`}).join('')}</div>
   <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Day</th><th>Company</th><th class="num">Cash collected</th><th class="num">Other cash in</th><th class="num">Expenses</th><th class="num">Net</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fday(r.d)}</td><td>${esc(CO[r.co].name)}</td><td class="num">${money(r.col)}</td><td class="num">${r.wd?money(r.wd):'–'}</td><td class="num">${r.ex?'− '+money(r.ex):'–'}</td><td class="num">${money(r.col+r.wd-r.ex)}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td>Total</td><td></td><td class="num">${money(tot('col'))}</td><td class="num">${money(tot('wd'))}</td><td class="num">− ${money(tot('ex'))}</td><td class="num">${money(tot('col')+tot('wd')-tot('ex'))}</td></tr></tfoot></table></div>
   <p class="small muted" style="margin:6px 0 0">Other cash in: money taken out of the Airtel wallet, and trip float not spent.</p>`;
}

V.lp=()=>{
  const lp=lpOf(S.ui.p);if(!lp)return'<div class="empty">Not found</div>';const r=U().role;const tot=sum(lp.items.map(i=>i.q));const cs=[...new Set(lp.items.map(i=>i.cust))];

     <div class="card"><div class="skulist">${Object.entries(bySku).map(([s,q])=>`<div class="sku"><div><div class="nm">${esc(skuName(s))}</div><div class="meta small muted">Planned: <b>${q}</b> cartons</div></div><input class="inp" style="width:90px;font-size:1.1rem" inputmode="numeric" id="wq-${s}" data-wq="${s}" data-plan="${q}" value="${q}" aria-label="Cartons loaded"></div>`).join('')||'<div class="empty">Nothing planned yet</div>'}</div></div>
     <label class="field"><span>Reason, if you changed a number</span><input id="wq-why" class="inp big" placeholder="e.g. Truck is full"></label>

    return hd+(lp.status==='loaded'?`<div class="actionbox"><h2>Let the vehicle out</h2>${docs}<button class="btn pri huge" data-act="lp-gate" data-no="${lp.no}">Vehicle has left</button></div>`:big(lp.status==='out'?'On the road.':'Delivered.','good')+docs)
      +`<div class="card"><h2>Products</h2><div class="list">${Object.entries(bySku).map(([s,q])=>`<div class="li"><span>${esc(skuName(s))}</span><b class="num">${q} ctn</b></div>`).join('')}</div></div>${logH}`;
  }
  if(r!=='drv'&&lp.status!=='planned'){let ch=false;lp.log.forEach(x=>{if(x.wh&&!x.seen&&(r==='mgmt'||LEAD[lp.fac]===S.ui.user)){x.seen=true;ch=true}});if(ch)save()}

    ${lp.status==='out'&&!done?(gate(['drv','mgmt'],lp,'Confirming delivery')||`<button class="btn pri big" data-go="drop" data-p="lp|${lp.no}|${c}">Hand over goods</button>`):''}</div>`}).join('');
  if(lp.status==='planned'){
    const can=r==='mgmt'||(r==='sales'&&lp.cos.some(canPlanCo));
    if(!can)return hd+gate(['sales'],lp,'Planning this vehicle');
    const cos=lp.cos.filter(c=>r==='mgmt'||canPlanCo(c));
    return hd+`${big('The warehouse already sees this plan, by product only. Change it any time until they make the delivery note.','info')}${logH}
     <div class="card grid"><div class="fields"><label class="field"><span>Vehicle</span>${sel('lp-veh',VEHICLES,lp.vehicle)}</label><label class="field"><span>Driver</span>${sel('lp-drv',DRIVERS,lp.driver)}</label></div>

     <h2>Open orders: ${esc(coNames(cos))}</h2>${planPicker(cos,lp.items,null,'No open orders for these companies.')}

/* ---- orders: hold, change, cancel, mark delivered; balance per line ---- */
function dots(o){const st=o.lines.map(l=>ls(o,l));const paid=(o.invs||[]).length&&(o.invs||[]).every(n=>{const i=S.invoices.find(x=>x.no===n);return i&&!bal(i)});
  const done=[o.status!=='cancelled',st.some(x=>x.plan||x.loaded),st.some(x=>x.loaded),o.status==='done',!!paid&&o.status==='done'];
  return `<div class="dots">${['Ordered','Planned','Loaded','Delivered','Paid'].map((s,i)=>`<span class="${done[i]?'done':i===done.indexOf(false)?'cur':''}"><i></i>${s}</span>`).join('')}</div>`}
V.order=()=>{
  const o=order(S.ui.p);if(!o)return '<div class="empty">Order not found</div>';const c=CUST[o.cust];const[s,k]=SAY[o.status]||['',''];

    const got=sum(rs.map(x=>x.amount))+sum(xs.map(x=>x.amount)),exT=sum(ex.map(e=>e.amount));const sub=S.handovers.filter(h=>h.collector===us&&h.status==='submitted');
    const me1=r==='sales';const open=S.ui.exp===us;const pay=S.ui.exp2||'cash';
    return `<div class="card grid"><b class="lg">${me1?'Your cash':esc(USERS[us].name)}</b>

       <label class="field"><span>What was it for?</span>${sel('ex-what',['Fuel','Loading labour','Vehicle repair','Food allowance','Airtime and data','Other'],S.ui.exw||'Fuel')}</label>
       <label class="field"><span>Amount (MWK)</span><input id="ex-amt" class="inp big" inputmode="numeric" placeholder="0" value="${esc(S.ui.exa||'')}"></label>
       <b>Paid with</b><div class="choices"><button class="choice ${pay==='cash'?'on':''}" data-act="ex-pay" data-v="cash">Cash</button><button class="choice ${pay==='airtel'?'on':''}" data-act="ex-pay" data-v="airtel">Airtel Money</button></div>
       ${pay==='airtel'?'<p class="small muted" style="margin:0">Goes in the Airtel Money ledger. It does not change your cash.</p>':''}
       ${photoField('ex','Photo of the bill')}
       <div class="row"><button class="btn pri big" data-act="exp-save2" data-u="${us}">Save expense</button><button class="btn big" data-act="exp-open" data-k="">Cancel</button></div></div>`:`<button class="btn big" data-act="exp-open" data-k="${us}">Add an expense</button>`}
     ${got?`<button class="btn pri huge" data-act="handover2" data-u="${us}">I gave ${money(Math.max(0,got-exT))} to Mr. Raza Ali</button>`:''}

V.dash=()=>{
  const cs=S.ui.rco&&visCos().includes(S.ui.rco)?[S.ui.rco]:visCos();const inC=x=>cs.includes(x.co);
  const inv=S.invoices.filter(inC);const MS=perFrom('mtd');
  const today=sum(inv.filter(i=>i.date>=T0).map(i=>i.total)),mtd=sum(inv.filter(i=>i.date>=MS).map(i=>i.total));
  const colT=sum(S.receipts.filter(r=>inC(r)&&r.at>=T0).map(r=>r.amount)),colM=sum(S.receipts.filter(r=>inC(r)&&r.at>=MS).map(r=>r.amount));
  const rec=sum(inv.map(bal)),od=sum(inv.filter(i=>i.due<T0).map(bal));
  const po=S.orders.filter(o=>inC(o)&&!['done','cancelled','rejected'].includes(o.status));const pc=sum(po.map(o=>sum(o.lines.map(l=>ls(o,l).bal))));
  const pl=S.lps.filter(lp=>lp.cos.some(c=>cs.includes(c))&&['planned','loaded'].includes(lp.status));const onr=S.lps.filter(lp=>lp.cos.some(c=>cs.includes(c))&&lp.status==='out').length+S.trips.filter(t=>inC(t)&&t.status==='ontrip').length;
  const outT=sum(S.lps.filter(lp=>lp.loadAt>=T0).flatMap(lp=>lp.items.filter(inC)).map(i=>i.q));const inT=sum(S.grn.filter(g=>inC(g)&&g.at>=T0).map(g=>g.qty));const chg=S.lps.reduce((n,lp)=>n+lp.log.filter(x=>x.wh&&x.at>=T0).length,0);
  const sk=SKUS.filter(inC);const free=sum(sk.map(s=>skuStock(s.id).avail)),low=sk.filter(s=>skuStock(s.id).avail<s.min).length;
  const cash=sum(S.receipts.filter(r=>inC(r)&&(r.custody==='with'||r.custody==='submitted')).map(r=>r.amount));const ap=S.airtel.filter(e=>inC(e)&&e.status==='pending');
  const N=(l,v,s,go,cls,p)=>`<button class="bignum ${cls||''}" data-go="${go}" ${p?`data-p="${p}"`:''}><span class="l">${l}</span><span class="v">${v}</span><span class="s">${s}</span></button>`;
  const byCo=cs.map(c=>({c,v:sum(inv.filter(i=>i.co===c&&i.date>=MS).map(i=>i.total))}));const mx=Math.max(...byCo.map(x=>x.v),1);
  return `${head('dash','Today’s numbers','Pick a company or see all four. Tap any number to open what is behind it.')}
  <div class="chips">${[['','All companies'],...visCos().map(c=>[c,CO[c].name])].map(([k,l])=>`<button class="chip ${(S.ui.rco||'')===k?'on':''}" data-act="dco" data-v="${k}">${esc(l)}</button>`).join('')}</div>
  <h2>Sales and money</h2><div class="bignums">${N('Sold today',kmoney(today),plural(inv.filter(i=>i.date>=T0).length,'invoice'),'invoices','','today')}${N('Sold this month',kmoney(mtd),plural(inv.filter(i=>i.date>=MS).length,'invoice'),'reports','','salescust')}${N('Money collected',kmoney(colT)+' today',kmoney(colM)+' this month','reports','','cash')}${N('Customers owe',kmoney(rec),'All unpaid invoices','reports','','aging')}${N('Overdue',kmoney(od),'Past the due date','invoices',od?'warn':'','overdue')}${N('Cash not yet with Mr. Raza Ali',kmoney(cash),'Held by sales managers','cash',cash?'warn':'')}${N('Airtel Money not ticked',kmoney(sum(ap.map(e=>e.cr))),plural(ap.length,'payment'),'airtel',ap.length?'warn':'')}</div>
  <h2>Orders and warehouse</h2><div class="bignums">${N('Pending orders',po.length,`${pc} cartons still to deliver`,'orders','','open')}${N('Pending loads',pl.length,`${sum(pl.flatMap(lp=>lp.items).map(i=>i.q))} cartons · ${onr} vehicles on the road`,'loading',pl.length?'warn':'')}${N('Warehouse today',`${outT} out · ${inT} in`,chg?`${plural(chg,'loading change')} by the warehouse`:'Cartons loaded and received','reports','','delivery')}${N('Stock free to sell',free+' ctn',low?`${plural(low,'product')} running low`:'Nothing running low','stock',low?'warn':'')}</div>
  <div class="card"><h2>This month by company</h2><div class="bars" style="margin-top:10px">${byCo.map(x=>`<div class="bar"><span>${coTag(x.c)}</span><span class="t"><i style="width:${x.v/mx*100}%;background:var(--c-${x.c})"></i></span><span class="num">${kmoney(x.v)}</span></div>`).join('')}</div></div>`;
};
