/* ---- search ---- */
V.search=()=>{
  const q=(S.ui.sq||'').trim().toLowerCase();const hit=t=>String(t).toLowerCase().includes(q);let out='';
  if(q.length>=2){
    const grp=(t,items)=>items.length?`<h2>${t} <span class="mono muted">${items.length}</span></h2><div class="picklist">${items.slice(0,8).join('')}</div>`:'';
    const custs=allowed('customer')?CUSTS.filter(c=>!c.walkin&&visCos().some(x=>c.cr[x])&&(hit(c.name)||hit(c.loc)||hit(c.phone))):[];
    const ords=S.orders.filter(o=>inVis(o)&&(hit(o.no)||hit(CUST[o.cust].name)||(o.dns||[]).some(hit)));
    const invs=allowed('invoice')?S.invoices.filter(i=>inVis(i)&&(hit(i.no)||hit(CUST[i.cust].name))):[];
    const lps=allowed('lp')?S.lps.filter(lp=>inVis(lp)&&(hit(lp.no)||hit(lp.dn||'')||hit(lp.gp||'')||hit(lp.vehicle))):[];
    const prods=SKUS.filter(s=>inVis(s)&&(hit(s.brand+' '+s.prod+' '+s.pack)||hit(s.id)));
    out=grp('Customers',custs.map(c=>`<button class="pick" data-go="customer" data-p="${c.id}"><b>${esc(c.name)}</b><span class="small muted">${esc(c.loc)} · ${CH[c.ch].label}</span></button>`))
     +grp('Orders',ords.map(o=>`<button class="pick" data-go="order" data-p="${o.no}"><b>${esc(CUST[o.cust].name)}</b><span class="small muted"><span class="mono">${o.no}</span> · ${fdate(o.at)} · ${money(orderTotal(o))}</span><span class="small">${esc(SAY[o.status][0])}</span></button>`))
     +grp('Invoices',invs.map(i=>`<button class="pick" data-go="invoice" data-p="${i.no}"><b>${esc(CUST[i.cust].name)}</b><span class="small muted"><span class="mono">${i.no}</span> · ${fdate(i.date)} · ${money(i.total)}</span><span class="small">${bal(i)?money(bal(i))+' still to pay':'Paid'}</span></button>`))
     +grp('Vehicles and delivery notes',lps.map(lp=>`<button class="pick" data-go="lp" data-p="${lp.no}"><b>${esc(lp.vehicle)}</b><span class="small muted"><span class="mono">${lp.no}${lp.dn?' · '+lp.dn:''}</span> · ${fdate(lp.at)}</span></button>`))
     +grp('Products',prods.map(s=>`<button class="pick" ${allowed('stock')?`data-go="stock" data-p="q:${esc(s.brand)}"`:'data-go="products"'}><b>${esc(s.brand)} ${esc(s.prod)} ${esc(s.pack)}</b><span class="small muted">${esc(CO[s.co].name)}${allowed('stock')?` · ${skuStock(s.id).avail} cartons free`:''}</span></button>`));
    if(!out)out='<div class="card empty">Nothing found. Try fewer letters.</div>';
  }
  return `${head('search','Search','Type at least 2 letters: a shop name, phone number, order, invoice or delivery note number, vehicle or product.')}
  <input id="s-q" class="inp big" placeholder="Type to search" value="${esc(S.ui.sq||'')}" autocomplete="off">${out}`;
};

function exportReport(f){
  if(f!=='xls'){if(f==='pdf')toast('Choose “Save as PDF” in the print window');setTimeout(()=>{try{window.print()}catch(e){}},f==='pdf'?600:0);return}
  const t=document.getElementById('rep');if(!t)return;
  const rows=[...t.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>'"'+td.textContent.trim().replace(/"/g,'""')+'"').join(','));
  const name=((t.dataset.name||'Report')+'.csv').replace(/[^\w .()-]/g,'');
  (async()=>{let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(!dl){toast('In the real app this saves an Excel file');return}
    try{await dl.save({filename:name,data:new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv'})});toast('Excel file saved')}catch(e){toast(e&&e.code==='declined'?'Not saved':'In the real app this saves an Excel file')}})();
}

      if(!t.stops.length)t.stops=['Stop 1'];S.trips.unshift(t);audit('Trip planned',t.no,t.route);$('#modal-root').innerHTML='';done('Trip planned. The warehouse will load it.','trip',t.no);break}
    case 'trip-load':{const t=trip(a.dataset.no);tripLoad(t,t.lines.map((l,i)=>Math.max(0,+val('tq-'+i)||0)),val('tl-veh'));done('Van loaded. Gate pass '+t.gp);break}
    case 'trip-sale':{const t=trip(a.dataset.no);const q={};t.lines.forEach((l,i)=>{const n=Math.max(0,Math.min(l.loaded-l.sold,+val('tsq-'+i)||0));if(n)q[l.sku]=n});if(!Object.keys(q).length){toast('Enter cartons sold');break}
      const inv=tripSale(t,val('ts-cust'),val('ts-stop'),q,val('ts-pay'),!!($('#ts-cash2')&&$('#ts-cash2').checked));S.ui.tm='';done(`Sale saved: ${money(inv.total)}`);break}
    case 'trip-close':{const t=trip(a.dataset.no);tripClose(t,t.lines.map((l,i)=>Math.max(0,+val('tr-'+i)||0)),+val('tc-cash').replace(/\D/g,'')||0);S.ui.tm='';done('Trip closed. Cash is with '+USERS[CO[t.co].mgr].name+' until handover.');break}
    case 'qty':{const k=a.dataset.sku;d.qty[k]=Math.max(0,(d.qty[k]||0)+(+a.dataset.d));$('#q-'+k).value=d.qty[k];save();drawBar();break}
    case 'submit-order':{const no=createOrder({...d,pay:d.pay||'credit',req:d.req?new Date(d.req).getTime():null});S.ui.draft=null;S.ui.hist=[];
      done(no.status==='pending_approval'?'Order sent to Management for approval':'Order confirmed. Stock is reserved','order',no.no);break}
    case 'approve':case 'reject':{const m=decide(a.dataset.kind,a.dataset.id,act==='approve');done(m);break}
    case 'cancel':cancelOrder(o);done('Order cancelled');break;
    case 'pick':pickDone(o,o.lines.map((l,i)=>Math.max(0,Math.min(l.qty,+val('pk-'+i)||0))),o.lines.map((l,i)=>val('pr-'+i)));done('Picked. Next: load the van');break;
    case 'load':loadDone(o,o.lines.map(l=>l.picked??l.qty),val('ld-veh'),val('ld-drv'));done('Loaded. Delivery note and gate pass are ready');break;
    case 'gate':gateOut(o);done('The van is on the road');break;
    case 'deliver':{const inv=deliver(o,val('dl-recv').trim()||'Receiving clerk',$('#dl-pod').checked,o.lines.map((l,i)=>Math.max(0,Math.min(l.loaded,+val('dv-'+i)||0))));done(`Delivered. Invoice ${inv.no} made`);break}
    case 'doc':modal(docHTML(a.dataset.t,o));break;
    case 'trace':modal(traceHTML(a.dataset.b));break;
    case 'close':case 'close-bg':$('#modal-root').innerHTML='';break;
    case 'rc-cust':S.ui.rc={cust:a.dataset.id,co:'',mode:'cash',amount:'',ref:''};done();break;
    case 'rc-co':S.ui.rc.co=a.dataset.v;done();break;
    case 'rc-mode':S.ui.rc.mode=a.dataset.v;S.ui.rc.amount=val('rc-amt').replace(/\D/g,'');done();break;
    case 'rc-reset':S.ui.rc=null;done();break;
    case 'receipt':{const r=S.ui.rc;r.ref=val('rc-ref')||r.ref;const rc=receipt({co:r.co,cust:r.cust,amount:+r.amount,mode:r.mode,ref:r.ref,collector:U().role==='sales'?S.ui.user:CO[r.co].mgr});if(r.mode!=='cash')rc.photo=(S.ui.photo||{}).rc||null;if(S.ui.photo)delete S.ui.photo.rc;S.ui.rc=null;S.ui.hist=[];done(`Payment of ${money(rc.amount)} saved`,'collections');break}
    case 'handover':{const h=handover(a.dataset.u,a.dataset.co);done(h?`${money(h.amount)} handed to Mr. Raza Ali. He will count it.`:'');break}
    case 'confirm-ho':{const h=S.handovers.find(x=>x.no===a.dataset.no);confirmHO(h,+val('ho-'+h.no).replace(/\D/g,'')||0);done(h.diff?`Confirmed, but ${money(Math.abs(h.diff))} is different`:'Counted and confirmed');break}
    case 'order-for':S.ui.draft=newDraft(a.dataset.cust);go('neworder');break;
    case 'pay-for':S.ui.rc={cust:a.dataset.cust,co:'',mode:'cash',amount:'',ref:''};if(S.ui.photo)delete S.ui.photo.rc;go('collections');break;
    case 'grn':{const sku=val('gr-sku'),no=val('gr-batch').trim()||(sku.split('-').slice(1).join('')+'-'+Math.floor(rnd()*900+100)),qty=+val('gr-qty')||0;if(qty<=0){toast('Enter the number of cartons');break}
      const s=SKU[sku];S.batches.push({no,sku,co:s.co,fac:CO[s.co].fac,mfg:now(),exp:new Date(val('gr-exp')).getTime()||dOff(365),qty,res:0,status:'Available'});
      const g={no:nextNo(s.co,'GRN'),co:s.co,sku,batch:no,qty,at:now(),by:me()};S.grn.push(g);audit('Stock received',g.no,`${qty} ctn ${sku} batch ${no}`);done(`${qty} cartons added to stock`,'stock');break}
    case 'adj':{const b=S.batches.find(x=>x.no===val('aj-batch'));const q=(val('aj-dir')==='-'?-1:1)*Math.abs(parseInt(val('aj-qty'))||0);if(!b||!q){toast('Choose a batch and a number');break}
      const x={no:nextNo(b.co,'ADJ'),co:b.co,sku:b.sku,batch:b.no,qty:q,reason:val('aj-reason'),status:'pending',by:me(),at:now()};S.adj.unshift(x);audit('Stock adjustment requested',x.no,`${q} ctn ${b.no}`);done('Sent for approval','stock');break}
    case 'newcust-form':modal(newCustForm());break;
    case 'new-cust':{const n=val('nc-name').trim();if(!n){toast('Enter the shop name');break}S.newcust.push({id:'N'+(S.newcust.length+1),name:n,ch:val('nc-ch'),loc:val('nc-loc')||'–',phone:val('nc-phone')||'–',co:val('nc-co'),limit:+val('nc-limit').replace(/\D/g,'')||0,terms:15,status:'pending',by:me(),at:now()});audit('New customer requested',n,'');$('#modal-root').innerHTML='';done(`${n} sent for approval`);break}
      const t={no:nextNo(co,'TRP'),type,co,date:new Date(val('tn-date')).getTime()||dOff(1),route:val('tn-stops').split(',').map(x=>x.trim()).filter(Boolean).slice(0,2).join(' and ')||'New route',stops:val('tn-stops').split(',').map(x=>x.trim()).filter(Boolean),vehicle:val('tn-veh'),staff:val('tn-staff'),status:'planned',lines:Object.entries(plan).map(([sku,p])=>({sku,plan:p,loaded:0,sold:0,ret:0})),sales:[],hist:[{at:now(),by:me(),t:'Trip planned',d:val('tn-stops')}],advance:[]};
    case 'per':S.ui.per=a.dataset.v;done();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;const d=S.ui.draft;
  if(id==='d-disc'){d.disc=t.value.replace(/[^\d.]/g,'');save();render();return}
  if(id==='d-cash2'){d.cash2=t.checked;save();render();return}
  if(id==='ex-what'){S.ui.exw=t.value;save();return}
  if(id==='ts-cust'){S.ui.ts.cust=t.value;save();render();return}
  if(id==='r-co'){S.ui.rco=t.value;save();render();return}
  if(id&&id.startsWith('ap-')&&S.ui.view==='settings'){S.settings.appr[id.slice(3)]=t.value;audit('Approval rule changed',id.slice(3),t.value);save();toast('Saved');return}
  if(t.dataset.photo){const k=t.dataset.photo,f=t.files&&t.files[0];if(!f)return;readPhoto(f,p=>{if(!p){toast('Could not read that photo');return}S.ui.photo=S.ui.photo||{};S.ui.photo[k]=p;try{save()}catch(x){}render()});return}
  if(id==='d-src'){d.src=t.value;save();return}
  if(id==='d-req'){d.req=t.value;save();return}
  if(t.dataset.off){if(t.checked)delete S.skuOff[t.dataset.off];else S.skuOff[t.dataset.off]=true;audit('Product '+(t.checked?'switched on':'switched off'),t.dataset.off,'');save();render();return}
  if(id&&id.startsWith('st-sh-')){S.settings.shelf[id.slice(6)]=+t.value;save();toast('Saved');return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.qty){const k=t.dataset.qty;S.ui.draft.qty[k]=Math.max(0,parseInt(t.value)||0);save();drawBar();return}
  if(t.id==='d-notes'){S.ui.draft.notes=t.value;save();return}
  if(t.id==='d-q'){S.ui.draft.q=t.value;save();rerenderKeep(t);return}
  if(t.id==='rc-amt'){S.ui.rc.amount=t.value.replace(/[^\d]/g,'');save();const b=$('#rc-save');if(b)b.disabled=!(+S.ui.rc.amount>0);return}
  if(t.id==='rc-ref'){S.ui.rc.ref=t.value;save();return}
  if(t.id==='ex-amt'){S.ui.exa=t.value.replace(/\D/g,'');save();return}
  if(t.dataset.tr!=null){const tp=trip(S.ui.p);const i=+t.dataset.tr;const l=tp.lines[i];const m=l.loaded-l.sold-(+t.value||0);const c=$('#tm-'+i);c.textContent=m?`${m} missing`:'';c.style.color=m?'var(--bad)':'inherit';return}
  if(t.id==='s-q'){S.ui.sq=t.value;save();rerenderKeep(t);return}
  if(t.id==='cq'){S.ui.cq=t.value;save();rerenderKeep(t);return}
  if(t.id==='st-q'){S.ui.stq=t.value;S.ui.p=null;save();rerenderKeep(t);return}
  if(t.id==='o-search'||t.id==='c-search'){S.ui.q=t.value;save();rerenderKeep(t);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal-root').innerHTML=''});

boot();if(!S.ui.view||S.ui.view==='start')S.ui.view='who';if(!S.settings.appr)S.settings.appr={adj:'mgmt',newcust:'mgmt',cancel:'sales'};save();render();
})();

</script>

</body></html>
